<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:dark;background:#120e1a}body{margin:0;font-size:14px}</style></head><body>
<title>奥术学徒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;800&display=swap">
<link rel="stylesheet" href="assets/textures/apparatus.css">
<style>
/* Layout: three-column workbench (tabs | active station | wand + pack), stacks to one column at phone width */
:root{
  --bg:#120e1a; --panel:#1a1427; --panel-hi:#241b36; --slot:#0f0b17;
  --line:#382c50; --line-hi:#5b4687;
  --fg:#ece6f8; --muted:#a698c4; --accent:#a97bff; --accent-ink:#17102a; --gold:#e9c46a;
  --ok:#6fd49a; --bad:#ff7a8a; --flux:#d062ea;
  --f-disp:'Noto Serif SC','Songti SC','STSong',serif;
  --f-latin:'Cinzel','Noto Serif SC',serif;
  --f-body:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:radial-gradient(900px 420px at 18% -8%,#2a1d46 0%,rgba(42,29,70,0) 70%),var(--bg);
  background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
small{color:var(--muted);font-weight:400}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:.08em;line-height:1.1}
.brand span{display:block;font-family:var(--f-latin);font-size:12px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-top:4px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:4px;font-size:13px}
.hchip b{font-variant-numeric:tabular-nums}
.hchip .bar{width:84px}
.wash-link:hover,.wash-link:focus-visible,.warp-link:hover,.warp-link:focus-visible,.wash-toggle:focus-visible{outline:1px solid var(--gold)}
.wash-link span:last-child{color:var(--gold)}
.card.wash-panel{margin-top:10px;padding:0}
.wash-toggle{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;background:none;border:0;width:100%;text-align:left;padding:8px 12px}
.wash-toggle::after{content:'▸';margin-left:auto;color:var(--gold)}
.wash-toggle[aria-expanded="true"]::after{content:'▾'}
.wash-body{padding:0 12px 12px}
.wash-methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:8px;margin-top:8px}
.wash-method{display:flex;align-items:center;text-align:left;gap:8px;padding:7px 9px}
.wash-method small{display:block;font-size:12px}
.wash-method strong{margin-left:auto;color:var(--ok)}
.warp-link[aria-expanded="true"]{border-color:var(--gold)}
#warp-toggle{scroll-margin-top:12px}
#world-banner:empty + .sec,#bag-banner:empty + .sec{margin-top:0}
#world-regions>.sec:first-child{margin-top:18px}
.warp-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 8px}
.warp-types div{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--slot);border:1px solid var(--line);border-radius:3px;padding:4px 7px}
.warp-types dt{font-size:12px;color:var(--muted)}
.warp-types dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.warp-panel p,.soap-controls p{font-size:13px}
.warp-panel p + p,.warp-panel .row,.soap-controls{margin-top:8px}
.warp-protection strong{color:var(--ok)}
.warp-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(146px,100%),1fr));gap:6px;margin:6px 0 10px}
.warp-actions .btn{text-align:left;min-height:42px}
.warp-actions .btn small{display:block;font-size:11px}
.warp-actions .btn[aria-disabled="true"],.soap-controls .btn[aria-disabled="true"]{opacity:.48;cursor:not-allowed}
.warp-actions .btn[aria-disabled="true"]:not(:focus-visible),.soap-controls .btn[aria-disabled="true"]:not(:focus-visible){border-color:var(--line);background:var(--panel-hi)}
.warp-actions .btn[aria-disabled="true"] small{color:var(--fg)}
.soap-controls strong{color:var(--gold);font-variant-numeric:tabular-nums}

/* quest strip */
.quest{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:4px;padding:10px 14px;margin-bottom:14px}
.quest .qn{font-family:var(--f-latin);font-size:12px;letter-spacing:.2em;color:var(--gold)}
.quest .qt{flex:1 1 260px;min-width:0}
.quest.done{border-color:var(--gold)}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
@media(max-width:1020px){.grid{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}.nav .tab small{display:none}.nav .tab b{font-size:11px}.nav .tab{padding:2px}.grid .nav{grid-template-columns:repeat(6,minmax(0,1fr))}}

.nav{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;max-width:960px}
.tab{aspect-ratio:1;width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px}
.tab b{display:block;font-family:var(--f-disp);font-size:13px;line-height:1.2}
.tab small{font-size:10px;line-height:1.3}
.tab:hover{border-color:var(--line-hi)}
.tab.on{background:var(--panel-hi);border-color:var(--gold)}
.tab.on b{color:var(--gold)}
.tab.lock{opacity:.55}

.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px}
.card+.card{margin-top:12px}
.card>h3,.sec>h3,.bag-item-detail>h3{font-size:16px;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.lead{color:var(--muted);margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:4px;padding:7px 14px;font-weight:500;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--accent);background:#2e2346}
.btn:focus-visible,.tab:focus-visible,.tile:focus-visible,.slot:focus-visible,.cat:focus-visible,.recipe-choice:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover:not(:disabled){background:#bb96ff}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* aspect + item icons */
.asp,.ico{--c:#a698c4;display:inline-grid;place-items:center;flex:0 0 auto;color:var(--fg);font-style:normal;font-weight:800;font-family:var(--f-disp);
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 28%,var(--panel-hi)),var(--slot));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,var(--line)),0 1px 2px #000}
.asp{width:24px;height:24px;border-radius:50%;font-size:12px}
.asp.lg{width:38px;height:38px;font-size:18px}
.asp.q{--c:#3a3052;color:var(--muted)}
.ico{width:34px;height:34px;border-radius:3px;font-size:16px}
.ico.s{width:22px;height:22px;font-size:12px}
.pixel-sprite{display:block;width:28px;max-width:calc(100% - 4px);aspect-ratio:1;
  background-image:url('assets/pixel-art/icons.png');background-size:var(--sheet-size);background-position:var(--sprite-position);background-repeat:no-repeat;image-rendering:pixelated}
.asp .pixel-sprite,.ico.s .pixel-sprite{width:16px}
.asp.lg .pixel-sprite{width:28px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--slot);border:1px solid var(--line);border-radius:14px;padding:2px 9px 2px 3px;font-size:13px}
.chip b{font-variant-numeric:tabular-nums}
.chip.z{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:8px;background:var(--slot);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:1 1 auto;min-width:40px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));width:0}

/* world tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{--c:#777;position:relative;text-align:left;border:1px solid var(--line);border-radius:4px;padding:0;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.tile .pic{position:relative;height:74px;display:grid;place-items:center;overflow:hidden;color:var(--fg);
  background:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 50%,rgba(255,255,255,.07) 50% 75%,transparent 75%) 0 0/10px 10px,linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 50%,#000))}
.tile .pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.pic-mark{position:relative;z-index:1;display:grid;place-items:center;width:40px;aspect-ratio:1;border:1px solid var(--line-hi);border-radius:4px;background:#211831e0}
.tile .tx{padding:8px 10px 10px}
.tile b{display:block;font-family:var(--f-disp)}
.tile small{display:block;font-size:12px}
.tile:hover:not(.lockd){border-color:var(--gold);transform:translateY(-1px)}
.tile:active:not(.lockd){transform:translateY(1px)}
.tile.lockd{opacity:.5;cursor:not-allowed}
.tile.taint .pic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#71307988 0 7px,#2a0f3699 7px 14px)}
.tile.taint .pic-mark{border-color:var(--flux)}
.tile.taint{border-color:var(--flux)}

/* backpack */
.bagwrap{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:720px){.bagwrap{grid-template-columns:minmax(0,1fr)}}
.bag9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.bag9 .slot{min-width:0;background:#0c0914;border-color:#000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.07),inset -1px -1px 0 rgba(255,255,255,.03)}
.bag9 .slot .ico{width:min(34px,78%);height:auto;aspect-ratio:1;font-size:clamp(11px,2.6vw,16px)}
.bag9 .slot.empty{opacity:.6}
.bag-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(76px,104px);align-items:start;gap:10px;margin-top:12px}
.bag-scanner{display:grid;justify-items:end;gap:4px;text-align:right}
.bag-scan{display:grid;place-items:center;gap:3px;min-width:64px;min-height:56px;padding:6px 8px;font-size:12px;line-height:1.25;color:var(--gold)}
.bag-scan img{display:block;width:30px;height:27px;object-fit:contain;image-rendering:pixelated}
.bag-scan[aria-disabled="true"]{border-color:var(--line);background:var(--slot);color:var(--muted);cursor:not-allowed}
.bag-scan[aria-disabled="true"] img{opacity:.48}
.bag-scan[data-scanned]{color:var(--ok)}
.bag-scanner small{font-size:11px;line-height:1.35}
.eqg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot.eqs{background:#0c0914;border-color:#000}
.slot.eqs .ico{width:min(34px,72%);height:auto;aspect-ratio:1;margin-bottom:8px}
.slot.eqs:not(.on) .ico{opacity:.35}
.slot .lb{position:absolute;left:0;right:0;bottom:2px;font-size:10px;line-height:1;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.eqs:not(.on) .lb{position:static;font-size:11px}
.eff{margin-top:12px;display:grid;gap:6px;font-size:13px}
.eff small{display:block;font-size:12px}
/* element book drawer */
#drawer{position:fixed;top:0;bottom:0;right:0;z-index:40;width:min(340px,88vw);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--gold);transform:translateX(100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawer.open{transform:none;box-shadow:-8px 0 24px rgba(0,0,0,.45)}
#drawer:not(.open) .dhead,#drawer:not(.open) #dbody{visibility:hidden}
#dtab{position:absolute;left:-37px;top:38%;width:37px;padding:14px 0;writing-mode:vertical-rl;letter-spacing:.2em;background:var(--panel);color:var(--gold);border:1px solid var(--gold);border-right:0;border-radius:6px 0 0 6px;font-family:var(--f-disp);font-weight:700;font-size:14px}
#dtab:hover{background:var(--panel-hi)}
#dtab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#mobile-drawer-toggle{display:none}
@media(max-width:720px){
 .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
 .top .hud{grid-column:1/-1}
}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:16px}
.dhead p{font-size:12px;color:var(--muted);margin-top:2px}
#dbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px;display:grid;gap:8px;align-content:start}
@media(max-width:1020px){
 #mobile-drawer-toggle{display:inline-flex;color:var(--gold)}
 #dtab,#drawer{display:none}
 #drawer.open{display:block;position:static;width:auto;transform:none;margin-top:14px;padding:0;border:1px solid var(--gold);border-radius:4px;box-shadow:none}
 #dbody{overflow:visible;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
}
.dr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--slot);border:1px solid var(--line);border-radius:4px;padding:8px}
.dr.on{border-color:var(--gold)}
.dr.zero .dn small{opacity:.7}
.dpick{background:transparent;border:0;padding:0;display:grid;place-items:center}
.dl{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:var(--muted)}
.dl .asp{width:20px;height:20px;font-size:10px}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
/* pop text */
#pops{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:fixed;font-weight:700;color:var(--gold);transform:translate(-50%,-8px);animation:up .9s ease-out forwards;text-shadow:0 1px 0 #000;white-space:nowrap}
.pop.bad{color:var(--bad)}
@keyframes up{to{transform:translate(-50%,-48px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.tile:hover,.tile:active{transform:none!important}}

/* recipes */
.recs{display:grid;gap:8px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.rec.no{background:#171122}
.rec b.nm{font-family:var(--f-disp)}
.rec p{color:var(--muted);font-size:13px}
.need{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.nc{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--slot);border:1px solid var(--line);border-radius:3px;padding:2px 7px 2px 3px}
.nc b{font-weight:500}
.nc em{font-style:normal;font-variant-numeric:tabular-nums}
.nc.ok em{color:var(--ok)}
.nc.lack{border-color:#6a3040}
.nc.lack em{color:var(--bad)}
.why{color:var(--bad);font-size:12px;margin-top:4px}
@media(max-width:520px){.rec{grid-template-columns:auto minmax(0,1fr)}.rec .btn{grid-column:1/-1}}

/* notes / research */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 12px}
.cat.on{border-color:var(--gold);color:var(--gold)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px;align-items:start}
.catalog-entry{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:8px 10px;min-width:0}
.catalog-entry[open]{border-color:var(--line-hi)}
.catalog-entry summary{cursor:pointer;display:flex;gap:8px;align-items:center}
.catalog-entry summary::after{content:"+";margin-inline-start:auto;color:var(--gold)}
.catalog-entry[open] summary::after{content:"−"}
.catalog-entry summary small{margin-inline-start:auto}
.catalog-entry p{font-size:13px;margin-top:7px}
.catalog-entry .btn,.catalog-entry .chips{margin-top:7px}
.bk{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.bk b{font-family:var(--f-disp)}
.bk small{display:block;font-size:12px}
.bk .eq{display:flex;align-items:center;gap:4px;margin-top:3px}
.bk.lockd{opacity:.5}

/* crucible, node */
.vessel{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.lab-prep{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"materials preview";gap:12px;align-items:start}
.lab-prep>.card{min-width:0;margin-top:0}
.distill-picker{grid-area:materials}
.distill-preview{grid-area:preview}
.lab-filter{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:0 0 10px}
.lab-filter select,.golem-job select{min-width:0;max-width:100%;font:inherit;color:var(--fg);color-scheme:dark;
 background:var(--slot);border:1px solid var(--line-hi);border-radius:4px;padding:6px}
.distill-options{max-height:240px;overflow:auto;padding:4px}
.lab-links{margin-top:10px}
.lab-links small{flex:1 1 180px}
.lab-status{margin:9px 0;color:var(--gold);font-family:var(--f-disp);font-weight:700}
.golem-builds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:8px}
.golem-job{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(120px,1fr) auto;gap:8px;align-items:center;
 padding:10px 0;border-bottom:1px solid var(--line)}
.golem-job:last-child{border-bottom:0;padding-bottom:0}
.golem-job:first-child{padding-top:0}
.golem-job label{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.golem-job p{font-size:12px}
@media(max-width:1020px){
 .lab-prep{grid-template-columns:minmax(0,1fr);grid-template-areas:"preview" "materials"}
 .distill-options{max-height:none;overflow:visible}
}
@media(max-width:520px){
 .dis{grid-template-columns:auto minmax(0,1fr)}.dis>.row{grid-column:1/-1}
 .golem-job{grid-template-columns:auto minmax(0,1fr) auto}.golem-job label{grid-column:1/-1;grid-row:2}
}
.meter{display:grid;gap:4px}
.meter .bar{height:12px}
.dis{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.dis:first-child{border-top:0}
.node{display:grid;gap:10px}

/* side */
.side>.card{margin-bottom:12px}
.side .card+.card{margin-top:0}
.side h3{font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.vrow{display:grid;grid-template-columns:auto 1fr 62px;gap:8px;align-items:center;margin-bottom:5px}
.vrow span{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.slot{position:relative;aspect-ratio:1;background:var(--slot);border:1px solid var(--line);border-radius:3px;padding:0;display:grid;place-items:center}
.slot .ico{width:34px;height:34px}
.slot em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:11px;font-weight:700;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.slot.on{border-color:var(--gold)}
.slot.scanned::after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"table picker";gap:12px;align-items:start}

const RSD=Object.fromEntries(RS.map(r=>[r.id,r]));
const NOTES_HEXES=Array.from({length:7},(_,column)=>column-3).flatMap(q=>
 Array.from({length:7-Math.abs(q)},(_,index)=>[q,Math.max(-3,-q-3)+index]));
const NOTES_HEX_INDEX=new Map(NOTES_HEXES.map((pos,i)=>[pos.join(','),i]));
const NOTES_HEX_DIRECTIONS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const NOTES_HEX_NEIGHBORS=NOTES_HEXES.map(([q,r])=>NOTES_HEX_DIRECTIONS
 .map(([dq,dr])=>NOTES_HEX_INDEX.get([q+dq,r+dr].join(','))).filter(i=>i!==undefined));
// The original center row determines the fixed anchors and legacy slot positions.
function researchTrackCell(d,step){
 const q=step-Math.floor((d.len+1)/2);
 return NOTES_HEX_INDEX.get([q,-Math.floor(q/2)].join(','));
}
const researchAnchors=d=>[researchTrackCell(d,0),researchTrackCell(d,d.len+1)];
function researchAspects(r){
 const d=RSD[r.id],[start,end]=researchAnchors(d),aspects=r.cells.slice();
 aspects[start]=d.a;aspects[end]=d.b;
 return aspects;
}

const isAmount=v=>Number.isFinite(v)&&v>=0;
const isCount=v=>Number.isSafeInteger(v)&&v>=0;
const isFlag=v=>v===0||v===1||typeof v==='boolean';
const hasId=(table,id)=>typeof id==='string'&&Object.hasOwn(table,id);
const validMap=(map,test,ids)=>isRecord(map)&&Object.entries(map).every(([id,v])=>(!ids||Object.hasOwn(ids,id))&&test(v));

function decodeSave(text){
 let data=JSON.parse(text);
 if(isRecord(data)&&Object.hasOwn(data,'format')){
  if(data.format!==KEY)return null;
  data=data.state;
 }
 if(!isRecord(data)||!Object.hasOwn(data,'inv')||!Object.hasOwn(data,'ever'))return null;

 const state=fresh();
 const legacyEquipment=data.equip==null;
 for(const key of Object.keys(state)){
  if(Object.hasOwn(data,key)&&!(key==='equip'&&legacyEquipment))state[key]=data[key];
 }
 const {inv,ever,pool,ess,distilled,jars,distill,infusion,known,scanned,res,has,built,vis,aura,tools,wand,cru,equip,outer,node,rs,golems,taint,log}=state;
 if(!isRecord(outer)||!isFlag(outer.on)||![outer.depth,outer.best].every(isCount)||!isAmount(outer.st))return null;
 if(![inv,ever,outer.loot].every(map=>validMap(map,isCount,IT)))return null;
 if(![pool,ess].every(map=>validMap(map,isCount,A))||!P.every(p=>Object.hasOwn(pool,p)))return null;
 if(![[known,A],[scanned,IT],[res,RSD],[has],[built]].every(([map,ids])=>validMap(map,isFlag,ids)))return null;
 if(![vis,aura].every(map=>validMap(map,isAmount,A)&&P.every(p=>Object.hasOwn(map,p))))return null;
 if(!validMap(jars,isFlag,A)||!validMap(distilled,n=>isCount(n)&&n<=ESSENTIA_LIMIT,A)
  ||Object.keys(distilled).some(a=>!Object.hasOwn(jars,a)||!jars[a]))return null;
 if(distill!==null&&!validDistillation(state))return null;
 if(infusion!==null&&(!has.altar||!isRecord(infusion)||!hasId(RECIPES,infusion.id)||RECIPES[infusion.id].st!=='inf'
  ||!Number.isInteger(infusion.left)||infusion.left<1||infusion.left>infusionDuration(RECIPES[infusion.id])))return null;
 if(isCount(state.warp)){
  // The old counter mixed research and exploration. Only completed research proves a permanent share.
  const total=state.warp;
  const researchWarp=RS.reduce((sum,r)=>sum+(res[r.id]?Math.ceil((r.warp||0)/2):0),0);
  const permanent=Math.min(total,researchWarp);
  state.warp={permanent,normal:total-permanent,temporary:0};
  state.warpCounter=total;
 }
 if(!isRecord(state.warp)||Object.keys(state.warp).length!==WARP_TYPES.length||!WARP_TYPES.every(k=>isCount(state.warp[k]))
  ||!isCount(warpTotal(state.warp)))return null;
 if(!isAmount(state.flux)||![state.warpCounter,state.ward,state.visExhaust,state.search,state.stab,state.tk].every(isCount)||!isFlag(state.won))return null;
 if(state.ward>1600||state.visExhaust>300)return null;
 if(state.scrub!==null&&(!isRecord(state.scrub)||!isCount(state.scrub.left)||state.scrub.left<1
  ||state.scrub.left>SOAP_SECONDS||typeof state.scrub.bath!=='boolean'))return null;
 if(!isFlag(state.winDismissed))return null;
 if(!isRecord(tools)||![tools.pick,tools.axe].every(isCount))return null;
 if(!isRecord(cru)||![cru.water,cru.heat].every(isAmount))return null;

function researchPath(r){
 const [start,end]=researchAnchors(RSD[r.id]),aspects=researchAspects(r);
 const queue=[start],previous=new Map([[start,null]]);
 for(let head=0;head<queue.length;head++){
  const i=queue[head];
  if(i===end){
   const path=new Set();
   for(let step=end;step!==null;step=previous.get(step))path.add(step);
   return path;
  }
  for(const next of NOTES_HEX_NEIGHBORS[i]){
   if(previous.has(next)||!aspects[next]||!linked(aspects[i],aspects[next]))continue;
   previous.set(next,i);queue.push(next);
  }
 }
 return null;
}

 if(S.cru.heat<=0||S.cru.water<=0){msg('坩埚需要先加热并加水。','bad');return}
 const parts=Object.entries(IT[id].a);
 const capacity=parts.reduce((limit,[a,n])=>Math.min(limit,Math.floor((ESSENTIA_LIMIT-(S.ess[a]||0))/n)),inv(id));
 const n=all?capacity:Math.min(1,capacity);
 if(n<=0){msg('材料不足或坩埚中的精华已满。','bad');return}
 take(id,n);S.cru.water--;
 for(const [a,count] of parts){
  S.ess[a]=(S.ess[a]||0)+count*n;
  S.known[a]=1;
 }
 msg(`溶解 ${IT[id].n} ×${n}。`);
 if(e)pop(e,'溶解');
 render();
 animateCrucible('dissolve',dominantLabColor(IT[id].a),itemIcon(id));
}
function transcribe(id,distilled,all,e){
 const stock=distilled?S.distilled:S.ess;
 const available=stock[id]||0;
 if(!available)return;
 const count=all?available:1;
 takeEssence(stock,id,count);
 S.pool[id]=(S.pool[id]||0)+count;
 S.known[id]=1;
 if(e)pop(e,`+${count} 灵感`);
 render();
}
const distillParts=(from,id)=>from==='ess'?{[id]:1}:IT[id].a;
const distillSourceName=(from,id)=>from==='ess'?A[id].f+'精华':IT[id].n;
function validDistillation(state){
 const job=state.distill;
 if(!state.has.distiller||!isRecord(job)||!['ess','item'].includes(job.from)
  ||!isCount(job.count)||job.count<1||job.count>(state.has.condenser?16:8)
  ||!isCount(job.duration)||job.duration<2||job.duration>11
  ||!isCount(job.left)||job.left<1||job.left>job.duration)return false;
 if(job.from==='ess'?!hasId(A,job.id):!dissolvable(job.id))return false;
 return Object.entries(distillParts(job.from,job.id)).every(([a,n])=>
  state.jars[a]&&(state.distilled[a]||0)+n*job.count<=ESSENTIA_LIMIT);
}
function distillOffer(from,id){
 const parts=Object.entries(distillParts(from,id));
 const jars=parts.filter(([a])=>!S.jars[a]).map(([a])=>a);
 const fuel=inv('alumentum')>0&&id!=='alumentum'?'alumentum':'coal';
 const reserved=id===fuel?1:id==='jar'?jars.length:0;
 const available=from==='ess'?(S.ess[id]||0):Math.max(0,inv(id)-reserved);
 const max=parts.reduce((limit,[a,n])=>Math.min(limit,Math.floor((ESSENTIA_LIMIT-(S.distilled[a]||0))/n)),
  Math.min(available,S.has.condenser?16:8));
 const why=[];
 if(S.distill)why.push('蒸馏炉正在处理上一批');
 if(!available)why.push('材料不足');
 else if(max<1)why.push('有精华罐容量不足，可先注魔或誊写灵感');
 if(inv('jar')<jars.length)why.push(`需要 ${jars.length} 个空精华罐`);
 if(!inv(fuel))why.push('需要煤炭或炼金燃料');
 return {max,jars,fuel,why,parts};
}
function startDistill(from,id,all){
 if(!S.has.distiller||(from==='ess'?!hasId(A,id):from!=='item'||!dissolvable(id)))return;
 const offer=distillOffer(from,id);
 if(offer.why.length){msg(offer.why.join('。')+'。','bad');return}
 const count=all?offer.max:1;
 if(from==='ess')takeEssence(S.ess,id,count);
 else take(id,count);
 take(offer.fuel,1);
 if(offer.jars.length)take('jar',offer.jars.length);
 for(const a of offer.jars)S.jars[a]=1;
 const duration=Math.max(2,3+Math.ceil(count/2)-(S.has.condenser?2:0)-(offer.fuel==='alumentum'?1:0));
 S.distill={from,id,count,left:duration,duration};
 U.distillResult=null;
 save();
 render();
}
function finishDistill(){
 const {from,id,count}=S.distill;
 for(const [a,n] of Object.entries(distillParts(from,id))){
  S.distilled[a]=(S.distilled[a]||0)+n*count;
  S.known[a]=1;
 }
 S.distill=null;
 U.distillResult={from,id,count,until:S.tk+3};
 S.has.distilledBatch=1;
 msg(`蒸馏完成：${distillSourceName(from,id)} ×${count}，精华已入罐。`,'good');
 save();
}

/* ---------- 魔像 ---------- */
function golemLock(t,id){
 if(id===null)return '待命';
 const task=GTASK[id],site=SITES[task.site];
 if(GT[t].rank<task.rank)return `需要 ${task.rank} 级魔像`;
 if(site.res&&!S.res[site.res])return `需要研究「${RSD[site.res].n}」`;
 return '';
}
const golemBoost=()=>inv('transvector')>0?1.5:1;
const golemRate=(t,id)=>GTASK[id].rate*GT[t].m*golemBoost();
function assignGolem(i,id){
 const g=S.golems[i];
 if(!g||g.task===id||(id!==null&&(!hasId(GTASK,id)||golemLock(g.t,id))))return;
 g.task=id;
 g.acc=0;
 renderMain();
}
function buildGolem(t){
 if(!S.res.GOLEMANCY||!hasId(GT,t))return;
 const g=GT[t];
 if(g.res&&!S.res[g.res]){msg(`需要研究「${RSD[g.res].n}」。`,'bad');return}
 if(S.golems.length>=GOLEM_LIMIT){msg(`最多同时拥有 ${GOLEM_LIMIT} 个魔像。`,'bad');return}
 for(const [id,n] of Object.entries(g.cost))if(inv(id)<n){msg('材料不足。','bad');return}
 for(const [id,n] of Object.entries(g.cost))take(id,n);
 S.golems.push({t,task:'log',acc:0});
 msg(`${g.n}站了起来。`,'good');
 checkWin();
 render();
}

/* ---------- 胜利 ---------- */
function isEq(id){return Object.keys(S.equip).some(s=>S.equip[s]===id)}
function has(id){return inv(id)>0||isEq(id)}
function eqVal(p){let v=0;for(const s in S.equip){const id=S.equip[s];if(id&&EQ[id]&&EQ[id][p])v+=EQ[id][p]}return v}
function setBonus(){return S.equip.body==='robe_chest'&&S.equip.legs==='robe_legs'&&S.equip.feet==='robe_boots'}
function ichorSet(){return S.equip.head==='ichor_cowl'&&S.equip.body==='ichor_robe'&&S.equip.legs==='ichor_legs'&&S.equip.feet==='ichor_boots'}
function slotFor(id){const sl=EQ[id].slot;if(sl!=='ring')return sl;if(!S.equip.ring1)return 'ring1';if(!S.equip.ring2)return 'ring2';return 'ring1'}
function equipItem(id,renderView=true){
 if(!EQ[id]||inv(id)<1)return;
 if(EQ[id].slot==='ring'&&isEq(id)){msg('已经戴着一枚同样的戒指了。','bad');return}
 const sl=slotFor(id),old=S.equip[sl];
 take(id,1);if(old)S.inv[old]=inv(old)+1;
 S.equip[sl]=id;msg(`装备了${IT[id].n}。`,'good');
 if(renderView)render();
}
function unequip(sl){
 const id=S.equip[sl];if(!id)return;
 S.equip[sl]=null;S.inv[id]=inv(id)+1;msg(`卸下了${IT[id].n}。`);render();
}
function useItem(id){
 if(inv(id)<1)return;
 if(id.startsWith('shard_')){
  if(!hasWand()){msg('需要先有一根魔杖。','bad');return}
  const p=id.slice(6);S.vis[p]=Math.min(wandMax(),S.vis[p]+12);take(id,1);msg(`向魔杖充入了 12 点${A[p].f}魔力。`,'good');render();
 }
}
const HZ=['暗影从裂缝里伸出手。','脚下的地面忽然变成了水。','一阵低语让你耳鸣。','有东西在看着你，你确定。','空气里的魔力凝成了刀刃。'];
function outerBank(){const o=S.outer;for(const k in o.loot)give(k,o.loot[k])}
function outerReset(){S.outer={on:0,depth:0,st:100,loot:{},best:S.outer.best||0}}
function outerEnd(){
 if(inv('escape')>0){take('escape',1);outerBank();gainWarp('temporary',1);msg('逃脱符印发出微光，你带着战利品回到了现实。','gold')}
 else{gainWarp('temporary',3);addFlux(12);msg('稳定度归零，你被异域吞没，战利品全部丢失。临时扭曲 +3。','bad')}
 outerReset();
}
function outerDeeper(e){
 const o=S.outer;if(!o.on)return;
 o.depth++;o.best=Math.max(o.best||0,o.depth);
 if(ichorSet())o.st=Math.min(100,o.st+3);
 if(o.depth>=3&&Math.random()<.2)gainWarp('temporary',1);
 if(Math.random()<Math.max(.05,Math.min(.75,.22+o.depth*.06)-eqVal('hazard'))){
  const dmg=Math.round((8+o.depth*3+Math.floor(Math.random()*8))*(1-Math.min(.7,eqVal('dmg'))));
  o.st-=dmg;addFlux(1);msg(`${rnd(HZ)}稳定度 −${dmg}。`,'bad');pop(e,'−'+dmg,'bad');
  if(o.st<=0)outerEnd();
 }else{
  const tbl=[['voidshard',4],['shard',3],['flesh',2]];
  if(o.depth>=2)tbl.push(['quartz',2]);
  if(o.depth>=3)tbl.push(['ichor',1+Math.floor(o.depth/3)]);
  let w=tbl.reduce((x,d)=>x+d[1],0)*Math.random(),item=tbl[0][0];
  for(const d of tbl){w-=d[1];if(w<=0){item=d[0];break}}
  if(item==='shard')item='shard_'+rnd(P);
  const q=1+(Math.random()<.4?1:0)+Math.floor(o.depth/4)+(Math.random()<eqVal('loot')?1:0);
  o.loot[item]=(o.loot[item]||0)+q;
  msg(`你在第 ${o.depth} 层找到了 ${IT[item].n} ×${q}。`,'good');pop(e,'+'+q+' '+IT[item].n);
 }
 render();
}
function outerRetreat(){
 const o=S.outer;if(!o.on)return;
 const n=Object.keys(o.loot).reduce((x,k)=>x+o.loot[k],0);
 outerBank();msg(`你撤离了异域，带回 ${n} 件战利品。`,'good');outerReset();render();
}
function checkWin(){
 if(!S.won&&S.wand.cap&&CAPS[S.wand.cap].rank>=CAPS.void.rank&&has('amulet')&&S.golems.length>=3){
  S.won=1;
  S.winDismissed=0;
  msg('你通过了毕业试炼。','gold');
 }
}

 link.href=url;

/* ---------- 渲染：公共 ---------- */
const needI=(id,n)=>`<span class="nc ${inv(id)>=n?'ok':'lack'}">${itemIcon(id,'s')}<b>${IT[id].n}</b><em>${inv(id)}/${n}</em></span>`;
const needV=(p,n)=>{const c=vcost(n),h=Math.floor(S.vis[p]||0);return `<span class="nc ${h>=c?'ok':'lack'}">${aspIcon(p)}<b>魔力</b><em>${h}/${c}</em></span>`};
const needE=(a,n,stock)=>{
 const have=stock[a]||0;
 return `<span class="nc ${have>=n?'ok':'lack'}">${aspIcon(a)}<b>${A[a].f}</b><em>${have}/${n}</em></span>`;
};
const recipeIcon=r=>r.out?itemIcon(Object.keys(r.out)[0]):objectIcon(r.id,r.c||'#7a5cd6',r.gl||'魔');
const recipeOutput=r=>Object.entries(r.out||{}).map(([id,count])=>`${IT[id].n} ×${count}`).join('、');
function recipeNeeds(r){
 return Object.entries(r.inp||{}).map(([id,count])=>needI(id,count)).join('')
  +Object.entries(r.vis||{}).map(([id,count])=>needV(id,count)).join('')
  +Object.entries(r.ess||{}).map(([id,count])=>needE(id,count,recipeStock(r))).join('');
}
function recRow(r){
 const c=canRecipe(r);
 const outTxt=recipeOutput(r);

function craftingSlots(inputs,r,[x,y,step]){
 const total=inputs.reduce((sum,[,count])=>sum+count,0);
 const stacks=total<=9?inputs.flatMap(([id,count])=>Array.from({length:count},()=>[id,1])):inputs;
 const shape=RECIPE_LAYOUTS[r.id]||TOOL_LAYOUTS[r.tool?.[0]]||(r.eq?.[0]==='cap'?CAP_LAYOUT:null);
 const positions=shape?.length===stacks.length?shape:[4,1,7,3,5,0,2,6,8];
 const placed={};
 return stacks.slice(0,9).map(([id,count],index)=>{
  const cell=positions[index];
  placed[id]=(placed[id]||0)+count;
  return stationItem(id,count,x+step*(cell%3),y+step*Math.floor(cell/3),true,inv(id)<placed[id]);
 }).join('');
}

}
function pressSelected(container,id){
 for(const button of container.querySelectorAll('button')){
  const pressed=String(button.dataset.id===id);
  if(button.getAttribute('aria-pressed')!==pressed)button.setAttribute('aria-pressed',pressed);
 }
}
function renderWorkbench(station){
 const mode=station==='craft'&&U.craftGroup==='smelt'?'furnace':station;
 const gui=WORKBENCH_GUI[mode];
 const list=R.filter(r=>r.st===station&&rvis(r)&&(station!=='craft'||r.g===U.craftGroup));
 const recipe=list.find(r=>r.id===U.recipe[station]);
 const picker=$('#workbench-recipes');
 setHtml(picker,list.map(r=>`<button class="recipe-choice" data-act="selectRecipe" data-id="${r.id}" aria-pressed="false">${recipeIcon(r)}<b>${r.n}</b></button>`).join('')||'<p class="muted">暂无可选配方。</p>');
 pressSelected(picker,recipe?.id);
 if(station==='craft')pressSelected($('#workbench-groups'),U.craftGroup);

 const condition=recipe?canRecipe(recipe):null;
 const quantity=recipe?.out?Object.values(recipe.out)[0]:1;
 const resultName=recipe?(recipeOutput(recipe)||recipe.n):'成品预览';
 const result=recipe?recipeIcon(recipe)+stationCount(quantity):'';
 const inputs=Object.entries(recipe?.inp||{});
 const ingredients=recipe?(mode==='furnace'?furnaceSlots(inputs):craftingSlots(inputs,recipe,gui.grid)):'';
 const labels=mode==='arcane'
  ?workbenchWand()+workbenchVis(recipe)
  :`<span class="station-position station-label ${mode==='furnace'?'furnace-label':''}" style="--x:${mode==='furnace'?0:28};--y:6;--w:${mode==='furnace'?176:110}">${mode==='furnace'?'熔炉':'合成'}</span>
   <span class="station-position station-label" style="--x:8;--y:72;--w:90">物品栏</span>`;
 const costs=recipe?.vis?`<div class="station-vis" aria-label="魔杖魔力">${Object.entries(recipe.vis).map(([id,count])=>needV(id,count)).join('')}</div>`:'';
 const details=recipe?`<div class="workbench-detail"><b>${resultName}</b><p>${recipe.d}</p>
  <div class="need">${inputs.map(([id,count])=>needI(id,count)).join('')}</div>${costs}${condition.why.length?`<div class="why">${condition.why.join('；')}</div>`:''}</div>`
  :'<p class="muted">选中配方后查看材料和成品。</p>';
 const board=$('#workbench-board');
 if(board.dataset.station!==mode)board.dataset.station=mode;
 setHtml($('#workbench-title'),`${objectIcon(gui.icon,gui.color,gui.glyph,'s')} ${gui.name}`);
 setHtml($('#workbench-display'),labels+ingredients+workbenchPack(gui.pack));
 setHtml($('#workbench-preview'),details);
 const output=$('#workbench-output');
 const position=stationPosition(...gui.output);
 if(output.getAttribute('style')!==position)output.setAttribute('style',position);
 if(output.title!==resultName)output.title=resultName;
 setHtml(output,result);
 const action=$('#workbench-action');
 const id=recipe?.id||'';
 const verb=recipe?.verb||gui.verb;
 const disabled=!condition?.ok;
 const outputLabel=recipe?`${verb}：${resultName}`:'成品槽';
 if(output.getAttribute('aria-label')!==outputLabel)output.setAttribute('aria-label',outputLabel);
 for(const button of [action,output]){
  if(button.dataset.id!==id)button.dataset.id=id;
  if(button.disabled!==disabled)button.disabled=disabled;
 }
 if(action.textContent!==verb)action.textContent=verb;
}
function infusionScene(job,result){
 const recipe=RECIPES[job?.id||result?.id];
 const ingredients=job?Object.entries(recipe.inp):[];
 const pedestal=labTexture(stationArt.pedestal);
 const displayItem=([id,count]=[])=>id?itemIcon(id)+(count>1?`<b>${count}</b>`:''):'';
 const trays=[-1,1].map((side,i)=>`<span class="altar-tray" style="--side:${side}">
  <span class="altar-tray-item">${displayItem(ingredients[i+1])}</span>${pedestal}</span>`).join('');
 const vials=job?Object.keys(recipe.ess).map((a,i)=>{
  const side=i%2===0?-1:1;
  const lane=Math.floor(i/2);
  return `<span class="altar-vial" style="--side:${side};--lane:${lane};--spread:${lane ? 0.74 : 1};--essence:${A[a].c};--delay:${i*180}ms">
   ${labTexture(stationArt.jar)}${aspIcon(a)}<span class="essence-stream">${aspIcon(a)}</span></span>`;
 }).join(''):'';
 const unstable=job&&recipe.inst>S.stab;
 const outputCount=Object.values(recipe?.out||{})[0];
 const product=result?recipeIcon(recipe)+(outputCount>1?`<b>${outputCount}</b>`:''):displayItem(ingredients[0]);
 return `<div class="lab-scene infusion-scene ${unstable?'unstable':''}" ${recipe?`style="--ritual:${dominantLabColor(recipe.ess)}"`:''} aria-hidden="true">
  <div class="altar-seal"></div><div class="altar-beam"></div>
  ${labTexture(stationArt.matrix,'altar-matrix')}
  <div class="altar-center"><span class="altar-core">${product}</span>${pedestal}</div>${trays}${vials}
  ${unstable?labSpecks('altar-spark',[-24,22,-10,16]):''}
 </div>`;
}

 return {

 };

function renderNotebook(main,markup){
 const active=document.activeElement;
 const focused=active?.matches('.notebook [data-act]')?active:null;
 const palette=main.querySelector('.notebook-palette');
 const board=main.querySelector('.notebook-sheet');
 const tabCell=board?.querySelector('[tabindex="0"]');
 const scroll=palette?.scrollTop;
 setHtml(main,markup);
 if(palette&&!palette.isConnected&&scroll){
  const updated=main.querySelector('.notebook-palette');
  if(updated)updated.scrollTop=scroll;
 }
 if(tabCell&&!tabCell.isConnected){
  const updated=main.querySelector('.notebook-sheet');
  if(updated?.dataset.research===board.dataset.research){
   setNotebookTabCell(updated.querySelector(`[data-i="${tabCell.dataset.i}"]`));
  }
 }
 if(!focused||focused.isConnected)return;
 const {act,id,i,kind}=focused.dataset;
 const controls=[...main.querySelectorAll('.notebook [data-act]')];
 const replacement=controls.find(el=>!el.disabled&&el.dataset.act===act&&el.dataset.id===id&&el.dataset.i===i&&el.dataset.kind===kind);
 if(replacement){replacement.focus({preventScroll:true});return}
 if(act==='startRes'&&!COMPACT_LAYOUT.matches)main.querySelector('.notebook-palette button')?.focus();
 if(act==='cell'||act==='cancelRes')main.querySelector('.notebook-node[aria-pressed="true"]')?.focus({preventScroll:true});
 if(act==='combine'&&kind==='pool')controls.find(el=>el.dataset.act==='selAsp'&&el.dataset.id===id)?.focus({preventScroll:true});
}

function researchTree(records,selected){
 const ranks={};
 const rank=d=>ranks[d.id]??=Math.max(0,...d.req.filter(id=>RSD[id].cat===d.cat).map(id=>rank(RSD[id])+1));
 const layers=[];
 for(const entry of records)(layers[rank(entry)]??=[]).push(entry);
 const rows=layers.flatMap(layer=>{
  const groups=[];
  for(let i=0;i<layer.length;i+=4)groups.push(layer.slice(i,i+4));
  return groups;
 });
 const positions=Object.fromEntries(rows.flatMap((row,y)=>row.map((entry,x)=>
  [entry.id,{x:(x+.5)*100/row.length,y,columns:row.length}])));
 const edges=records.map(entry=>entry.req.filter(id=>positions[id]).map(id=>{
  const start=positions[id],end=positions[entry.id],reverse=start.x>end.x;
  return `<span class="notebook-edge ${S.res[id]?'done':''} ${reverse?'reverse':''}" style="--x:${Math.min(start.x,end.x)}%;--y:${start.y};--w:${Math.abs(end.x-start.x)}%;--h:${end.y-start.y}"><i></i><i></i><i></i></span>`;
 }).join('')).join('');
 const nodes=rows.flat().map(entry=>{
  const state=notebookState(entry),{x,y,columns}=positions[entry.id];
  return `<button type="button" class="notebook-node ${state} ${entry.warp?'rare':''} ${entry.req.length?'':'round'}"
   style="--x:${x}%;--y:${y};--columns:${columns}" data-act="researchPick" data-id="${entry.id}"
   aria-label="${entry.n}，${NOTES_RESEARCH_STATES[state]}" aria-pressed="${selected===entry.id}" aria-controls="notebook-entry">
   <span class="notebook-medallion">${notebookIcon(NOTES_RESEARCH_ICONS[entry.id]||entry.a)}</span><span class="notebook-node-label">${entry.n}</span></button>`;
 }).join('');
 return `<div class="notebook-tree" style="--rows:${rows.length}"><div aria-hidden="true">${edges}</div>${nodes}</div>`;
}
function researchEntry(d){
 const state=notebookState(d);
 const unlocks=[...TILES.filter(t=>t.res===d.id).map(t=>t.n),...R.filter(r=>r.req===d.id).map(r=>r.n),
  ...Object.values(GT).filter(g=>g.res===d.id).map(g=>g.n)];
 const otherUnlocks=unlocks.filter(name=>!d.u.includes(name));
 const prerequisites=d.req.map(id=>`<button type="button" class="notebook-prerequisite ${S.res[id]?'done':''}"
  data-act="researchPick" data-id="${id}" aria-label="${RSD[id].n}，${S.res[id]?'已完成':'待完成'}">${RSD[id].n}</button>`).join('');
 return `<article class="notebook-entry" id="notebook-entry" aria-labelledby="notebook-entry-title"><div class="notebook-entry-page">
  <header><h3 id="notebook-entry-title">${d.n}</h3><span class="notebook-state ${state}">${NOTES_RESEARCH_STATES[state]}</span></header>
  <p>${d.d}</p>
  ${state==='ok'?`<button type="button" class="btn sm notebook-start" data-act="startRes" data-id="${d.id}" ${S.rs?'disabled':''}>开始研究</button>
   ${S.rs?`<small>请先完成或放弃「${RSD[S.rs.id].n}」。</small>`:''}`:''}
  </div><div class="notebook-entry-page">
  ${prerequisites?`<div><h4>前置研究</h4><div class="notebook-prerequisites">${prerequisites}</div></div>`:''}
  <div><h4>解锁内容</h4><p>${d.u}</p>${otherUnlocks.length?`<small>${otherUnlocks.join(' · ')}</small>`:''}</div>
  </div></article>`;
}

function puzzleHtml(){
 const r=S.rs,d=RSD[r.id],aspects=researchAspects(r);
 const [start,end]=researchAnchors(d);
 const connections=aspects.map((aspect,i)=>aspect
  ?NOTES_HEX_NEIGHBORS[i].filter(j=>aspects[j]&&linked(aspect,aspects[j])):[]);
 const links=connections.flatMap((neighbors,i)=>neighbors.filter(j=>j>i).map(j=>{
  const [x,y]=NOTEBOOK_HEX_CENTERS[i],[nextX,nextY]=NOTEBOOK_HEX_CENTERS[j];
  const dx=nextX-x,dy=nextY-y;
  return `<span class="notebook-hex-link" style="${notebookHexPosition(i)};--length:${Math.hypot(dx,dy)}%;--angle:${Math.atan2(dy,dx)}rad"></span>`;
 })).join('');
 const cells=aspects.map((aspect,i)=>{
  const position=notebookHexPosition(i);
  const icon=aspect?`<span aria-hidden="true">${aspIcon(aspect,'lg')}</span>`:'<span aria-hidden="true">+</span>';
  const [q,axialRow]=NOTES_HEXES[i];
  const location=`第 ${q+4} 列第 ${axialRow-Math.max(-3,-q-3)+1} 格`;
  const joined=connections[i].map(j=>A[aspects[j]].f).join('、');
  const adjacent=joined?`，与${joined}相连`:'';
  if(i===start||i===end)return `<span class="notebook-hex fixed" style="${position}"
   role="img" aria-label="固定${i===start?'起点':'终点'} ${A[aspect].f}，${location}${adjacent}">${icon}</span>`;
  const label=aspect?`取回 ${A[aspect].f}，${location}${adjacent}`:`放置元素，${location}`;
  return `<button type="button" class="notebook-hex ${aspect?'placed':'empty'}" style="${position}"
   data-act="cell" data-i="${i}" tabindex="${i===NOTES_HEX_INDEX.get('0,0')?0:-1}" aria-label="${label}">${icon}</button>`;
 }).join('');
 const pal=Object.keys(A).filter(k=>S.known[k]).map(k=>{
  const count=S.pool[k]||0,combineable=canCombine('pool',k);
  return `<div class="notebook-aspect ${count?'':'depleted'}">
   <button type="button" data-act="selAsp" data-id="${k}" aria-pressed="${U.sel===k}" aria-label="${A[k].f}，剩余 ${count} 点灵感">
    ${aspIcon(k)}<span>${A[k].f}</span><b>${count}</b></button>
   ${combineable?`<button type="button" data-act="combine" data-kind="pool" data-id="${k}" aria-label="用成分合成 1 点${A[k].f}">合成</button>`:''}
   </div>`;
 }).join('');
 const hint='<small id="notebook-puzzle-controls">选中元素后点空格放置，再点一次可取回。也可用方向键移动，按回车操作。新元素可在元素册合成。</small>';
 const palette=`<div class="notebook-palette">${pal}</div>`;
 const tools=`<div class="notebook-tools"><h4>${notebookIcon('items/inkwell')}元素灵感</h4>
  ${COMPACT_LAYOUT.matches?hint+palette:palette+hint}</div>`;
 const sheet=`<div class="notebook-sheet" data-research="${d.id}" role="group" aria-label="研究笔记，37 个六边格"
  aria-describedby="notebook-puzzle-rules notebook-puzzle-controls">
  <div aria-hidden="true">${links}</div>${cells}
 </div>`;
 return `<section class="notebook-puzzle" aria-labelledby="notebook-puzzle-title">
  <header class="notebook-puzzle-heading">
   <h3 id="notebook-puzzle-title">${notebookIcon('items/researchnotes')}${d.n}</h3>

function setNotebookTabCell(cell){
 const current=cell.closest('.notebook-sheet').querySelector('[tabindex="0"]');
 if(current===cell)return;
 if(current)current.tabIndex=-1;
 cell.tabIndex=0;
}
document.addEventListener('focusin',e=>{
 if(e.target.matches('.notebook-hex[data-act="cell"]'))setNotebookTabCell(e.target);
});
document.addEventListener('keydown',e=>{
 const cell=e.target.closest('.notebook-hex[data-act="cell"]');
 if(!cell||e.altKey||e.ctrlKey||e.metaKey)return;
 const [q,r]=NOTES_HEXES[cell.dataset.i];
 let column=q,rows;
 if(e.key==='ArrowUp'||e.key==='ArrowDown'){
  const step=e.key==='ArrowUp'?-1:1;
  rows=[r+step,r+2*step];
 }else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
  column+=e.key==='ArrowLeft'?-1:1;
  const row=r+Math.floor(q/2)-Math.floor(column/2);
  rows=[row,row+(q%2===0?-1:1)];
 }else return;
 e.preventDefault();
 const board=cell.closest('.notebook-sheet');
 for(const row of rows){
  const next=board.querySelector(`[data-i="${NOTES_HEX_INDEX.get([column,row].join(','))}"]`);
  if(next){next.focus({preventScroll:true});break}
 }
});

 const dev=[['attractor','动能吸引器','被动：世界采集时有 25% 概率多得 1 个'],['transvector','向量传送器','被动：魔像采集速度 +50%'],['bucket','永满水桶','在坩埚页使用：−2 水魔力，+4 水位'],['striker','熔火打火石','在坩埚页使用：−3 火魔力，+60 秒热量']].filter(d=>inv(d[0])>0);
 return `<div class="sec"><h3>工匠台 <small>用魔力与金属拼出实用的小装置</small></h3>
 ${dev.length?`<div class="card">${dev.map(d=>`<div class="dis">${itemIcon(d[0])}<div><b>${d[1]}</b><br><small>${d[2]}</small></div><span class="muted">已拥有</span></div>`).join('')}</div>`:''}
 <div class="recs" style="margin-top:12px">${list.map(recRow).join('')}</div>
 <p class="lead" style="margin-top:12px">更多装置随研究解锁。蛋糕和逃脱符印是异域探险用的消耗品。</p></div>`;
}
function vOuter(){
 const o=S.outer;
 const sup=`<div class="chips"><span class="chip" title="蛋糕：+40 稳定度">${itemIcon('cake','s')}<b>蛋糕 ${inv('cake')}</b></span><span class="chip" title="圣水：+30 稳定度">${itemIcon('holywater','s')}<b>圣水 ${inv('holywater')}</b></span><span class="chip" title="稳定度归零时自动触发">${itemIcon('escape','s')}<b>逃脱符印 ${inv('escape')}</b></span><span class="chip" title="镇静药剂：+50 稳定度">${itemIcon('tonic','s')}<b>药剂 ${inv('tonic')}</b></span></div>`;
 if(!o.on)return `<div class="sec"><h3>异域 <small>裂隙另一侧的高风险采集区</small></h3>
 <div class="card"><p class="lead">每深入一层，危险和收获同时增加。稳定度归零会丢掉所有战利品，扭曲 +3，污染 +12。随时可以撤离，把战利品带回来。深处能找到虚空灵液，浅处有虚空碎片、魔晶和奥术石英。</p>
 <div class="row"><button class="btn primary" data-act="outerGo">出发</button><span class="muted">最深纪录：${o.best} 层</span></div>
 <div class="row" style="margin-top:12px"><small>补给</small>${sup}</div>
 <p class="muted" style="margin-top:8px">${Math.min(.7,eqVal('dmg'))>0?`装备减伤：异域伤害 −${Math.round(Math.min(.7,eqVal('dmg'))*100)}%。`:'没有装备减伤。去背包里装上护符和法袍。'}</p></div></div>`;
 const risk=Math.round(Math.max(.05,Math.min(.75,.22+(o.depth+1)*.06)-eqVal('hazard'))*100);
 const st=Math.max(0,Math.round(o.st));
 const lk=Object.keys(o.loot);
 return `<div class="sec"><h3>异域 <small>第 ${o.depth} 层 · 下一层危险概率约 ${risk}%</small></h3>
 <div class="card"><div class="meter"><span>稳定度 <b>${st}</b>/100</span><div class="bar"><i style="width:${st}%;--c:${st<30?'var(--bad)':'var(--ok)'}"></i></div></div>
 <div class="row" style="margin-top:10px"><small>战利品</small>${lk.length?`<div class="chips">${lk.map(k=>`<span class="chip">${itemIcon(k,'s')}<b>${IT[k].n} ×${o.loot[k]}</b></span>`).join('')}</div>`:'<span class="muted">还没有</span>'}</div>
 <div class="row" style="margin-top:14px"><button class="btn primary" data-act="outerDeeper">深入下一层</button><button class="btn" data-act="outerRetreat">撤离（带走战利品）</button><button class="btn sm" data-act="outerCake" ${inv('cake')>0?'':'disabled'}>吃蛋糕 +40</button><button class="btn sm" data-act="outerHoly" ${inv('holywater')>0?'':'disabled'}>用圣水 +30</button><button class="btn sm" data-act="outerTonic" ${inv('tonic')>0?'':'disabled'}>镇静药剂 +50</button><button class="btn sm" data-act="outerRation" ${inv('travel_ration')>0?'':'disabled'}>行囊干粮 +25</button></div>
 <div class="row" style="margin-top:10px"><small>补给</small>${sup}</div></div></div>`;
}
const golemIcon=id=>objectIcon(GT[id].sprite,GT[id].c,GT[id].n[0]);
function vGolem(){
 return `<section class="sec"><h3>制造魔像</h3><p class="lead">核心在坩埚中激活。高级躯体可以负责低阶任务。</p><div class="golem-builds" id="golem-builds"></div></section>
 <section class="sec"><h3>工作安排</h3><div class="card" id="golem-jobs"></div></section>`;
}
function renderGolems(){
 setHtml($('#golem-builds'),Object.entries(GT).map(([id,g])=>{
  const unlocked=!g.res||S.res[g.res];
  const enough=Object.entries(g.cost).every(([item,n])=>inv(item)>=n);
  const ok=unlocked&&enough&&S.golems.length<GOLEM_LIMIT;
  const jobs=Object.entries(GTASK).filter(([,job])=>job.rank===g.rank).map(([item])=>IT[item].n);
  return `<div class="rec">${golemIcon(id)}<div><b class="nm">${g.n}</b><p>${g.rank} 级 · 速度 ×${g.m}</p>
   <p>可新增采集 ${jobs.join('、')}</p>
   ${unlocked?`<div class="need">${Object.entries(g.cost).map(([item,n])=>needI(item,n)).join('')}</div>`:
    `<p class="why">需要研究「${RSD[g.res].n}」</p>`}</div>
   <button class="btn ${ok?'primary':''}" data-act="golem" data-t="${id}" ${ok?'':'disabled'}>制造</button></div>`;
 }).join(''));
 setHtml($('#golem-jobs'),S.golems.map((g,i)=>{
  const type=GT[g.t],job=g.task;
  const locked=golemLock(g.t,job);
  const tainted=job!==null&&S.taint.includes(GTASK[job].site);
  const status=locked||(tainted?'地点已污染，暂停采集':`${golemRate(g.t,job).toFixed(2)} 个/秒 · ${SITES[GTASK[job].site].n}`);
  const opts=Object.keys(GTASK).filter(id=>id===job||GTASK[id].rank<=type.rank).map(id=>{
   const lock=golemLock(g.t,id);
   return `<option value="${id}" ${id===job?'selected':''} ${lock?'disabled':''}>${IT[id].n}${lock?' · '+lock:''}</option>`;
  }).join('');
  return `<div class="golem-job">${golemIcon(g.t)}
   <div><b>${type.n}</b><p class="${tainted||locked&&job?'why':'muted'}">${status}</p></div>
   <label>任务 <select data-golem-job="${i}" aria-label="${type.n} ${i+1} 的采集任务"><option value="" ${job===null?'selected':''}>待命</option>${opts}</select></label>
   <button class="btn sm" data-act="gdel" data-i="${i}">解散</button></div>`;
 }).join('')||'<p class="muted">先制造一只魔像，再为它分配采集任务。</p>');
}

/* ---------- 渲染：侧栏 ---------- */
function renderWand(){
 const el=$('#wandp');
 if(!hasWand()){setHtml(el,`<h3>魔杖</h3><p class="muted">还没有魔杖。在「合成」里制作木杖芯与铁杖帽。</p>`);return}
 const foci=['focus_dig','focus_fuse'].filter(k=>inv(k)>0);
 setHtml(el,`<h3>魔杖 <small>${RODS[S.wand.rod].n}杖芯 · ${CAPS[S.wand.cap].n}杖帽 · 消耗 -${Math.round(disc()*100)}%</small></h3>
 ${P.map(p=>`<div class="vrow">${aspIcon(p)}<div class="bar"><i id="vb-${p}" style="--c:${A[p].c}"></i></div><span id="vt-${p}"></span></div>`).join('')}
 <div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="charge" data-src="aura">吸取光环</button>${S.node?'<button class="btn sm" data-act="charge" data-src="node">吸取节点</button>':''}</div>
 <p class="muted" style="font-size:12px;margin-top:6px">光环每秒恢复，魔杖也会自动缓慢充能。</p>
 ${foci.length?`<div class="row" style="margin-top:8px"><small>焦点</small><button class="btn sm ${!S.focus?'primary':''}" data-act="focus" data-id="">无</button>${foci.map(k=>`<button class="btn sm ${S.focus===k?'primary':''}" data-act="focus" data-id="${k}">${IT[k].n}</button>`).join('')}</div>`:''}`);
 updateWand();
}
function updateWand(){
 if(!hasWand())return;
 const max=wandMax();
 for(const p of P)updateMeter('vt-'+p,'vb-'+p,`${Math.floor(S.vis[p])}/${max}`,S.vis[p]/max*100);
}
function renderDrawer(){
 if(!U.drawer)return;
 const body=$('#dbody');
 const ids=Object.keys(A).filter(k=>S.known[k]);
 setHtml(body,ids.map(id=>{
  const a=A[id],n=S.pool[id]||0;
  const nb=ids.filter(x=>NB[id].has(x));
  const comp=a.p?`<div class="dl"><small>成分</small>${aspIcon(a.p[0])}+${aspIcon(a.p[1])}</div>`:'<div class="dl"><small>原始元素</small></div>';
  const btn=a.p&&S.known[a.p[0]]&&S.known[a.p[1]]?`<button class="btn sm" data-act="combine" data-kind="pool" data-id="${id}" ${canCombine('pool',id)?'':'disabled'}>合成</button>`:'';
  return `<div class="dr ${U.sel===id?'on':''} ${n?'':'zero'}"><button class="dpick" data-act="selAsp" data-id="${id}" title="选中 ${a.f}">${aspIcon(id,'lg')}</button><div><div class="dn"><b>${a.f}</b> <small>${a.l} · 持有 ${n}</small></div>${comp}<div class="dl"><small>相邻</small>${nb.map(x=>aspIcon(x)).join('')}</div></div>${btn}</div>`;
 }).join(''));
}
function renderPools(){
 renderDrawer();
 const kn=Object.keys(A).filter(k=>S.known[k]);
 const es=Object.keys(S.ess);
 const stored=Object.keys(S.distilled);
 setHtml($('#pools'),`<h3>灵感 <small>研究用元素</small></h3>
 <div class="chips">${kn.map(k=>`<span class="chip ${S.pool[k]?'':'z'}">${aspIcon(k)}<b>${S.pool[k]||0}</b></span>`).join('')}</div>
 <div class="row" style="margin-top:8px"><button class="btn sm" data-act="ponder">沉思（+2 随机原始元素）</button></div>
 ${es.length?`<h3 style="margin-top:14px">坩埚精华</h3><div class="chips">${es.map(k=>`<span class="chip">${aspIcon(k)}<b>${S.ess[k]}</b></span>`).join('')}</div>`:''}
 ${stored.length?`<h3 style="margin-top:14px">罐装精华</h3><div class="chips">${stored.map(k=>`<span class="chip">${aspIcon(k)}<b>${S.distilled[k]}</b></span>`).join('')}</div>`:''}`);
}
function renderInv(){
 if(U.tab==='bag')return;
 const ks=IORDER.filter(k=>inv(k)>0);
 const tools=[];if(S.tools.pick)tools.push(PICK_NAMES[S.tools.pick]);if(S.tools.axe)tools.push(S.tools.axe>=2?'神秘金属斧':'铁斧');
 setHtml($('#invp'),`<h3>背包 ${tools.length?`<small>${tools.join(' · ')}</small>`:''}</h3>
 ${ks.length?`<div class="slots">${ks.map(k=>`<button class="slot ${U.insp===k?'on':''} ${S.scanned[k]?'scanned':''}" data-act="inspect" data-id="${k}" title="${IT[k].n}" aria-label="${IT[k].n} ×${inv(k)}">${itemIcon(k)}<em>${inv(k)}</em></button>`).join('')}</div>`:'<p class="muted">空空如也。去「世界」采集。</p>'}`);
}
function renderInfo(){
 if(U.tab==='bag'){setHtml($('#info'),'');return}
 const k=U.insp;
 if(!k||!IT[k]){setHtml($('#info'),`<h3>物品信息</h3><p class="muted">点背包里的物品查看。</p>`);return}
 renderItemInfo($('#info'),infoHtml(k));
 updateSoapControls();
}
function renderLog(){
 const el=$('#logp');if(!el)return;
 const h=`<h3>日志</h3><div class="log">${S.log.slice(-12).reverse().map(l=>`<p class="${l.k}">${escapeHtml(l.t)}</p>`).join('')||'<p class="muted">还没有记录。</p>'}</div>`;
 setHtml(el,h);
}
function renderFoot(){
 let confirmation;
 if(pendingImport){
  confirmation=`<span role="alert">导入将覆盖当前进度。</span><button class="btn sm primary" data-act="confirmImport">确认导入</button><button class="btn sm" data-act="cancelImport">取消</button>`;
 }else if(U.resetArm){
  confirmation=`<span>确定清空全部进度？</span><button class="btn sm" data-act="reset">确定重置</button><button class="btn sm" data-act="noreset">取消</button>`;
 }else{
  confirmation=`<button class="btn sm" data-act="reset" ${readingImport?'disabled':''}>重置存档</button>`;
 }
 setHtml($('#save-actions'),`<button class="btn sm" data-act="save">保存</button>
 <button class="btn sm" data-act="exportSave">导出 JSON</button>
 <button class="btn sm" data-act="importSave" ${readingImport||pendingImport?'disabled':''}>导入 JSON</button>
 ${confirmation}`);
}
function renderInventory(){
 renderQuest();renderInv();renderInfo();
 if(U.tab==='world'){updateWashPanel();updateWarpPanel()}
}
function render(){
 $('#invp').hidden=$('#info').hidden=(U.tab==='bag');
 renderHud();renderNav();renderMain();renderWand();renderPools();
 renderInventory();renderLog();renderFoot();
}

/* ---------- 实时更新 ---------- */
const inventoryTabs=new Set(['bag','craft','arcane','cru','distill','inf','golem','tinker','outer']);
const visTabs=new Set(R.filter(r=>r.vis).map(r=>r.st==='tink'?'tinker':r.st));
function updateLabPhase(phase,label){
 const scene=$('#lab-art .lab-scene'),status=$('#lab-status');
 if(scene&&scene.dataset.phase!==phase)scene.dataset.phase=phase;
 if(status&&status.textContent!==label)status.textContent=label;
 return scene;
}
function updateCrucible(){
 const {water,heat}=S.cru;
 const phase=water>0?(heat>0?'boiling':'filled'):(heat>0?'heated':'dry');
 const labels={dry:'坩埚待命',filled:'已加入水 · 等待加热',heated:'火源已点燃 · 等待加水',boiling:'正在沸腾 · 可溶解物质与炼金'};
 const scene=updateLabPhase(phase,labels[phase]);
 scene?.style.setProperty('--brew',dominantLabColor(S.ess));
 updateMeter('cwt','cwb',water,water/16*100);
 updateMeter('cht','chb',Math.ceil(heat),heat/240*100);
}
function updateDistillation(){
 const job=S.distill;
 const batch=job||U.distillResult;
 if(!batch){updateLabPhase('idle','蒸馏炉待命');return}
 const name=`${distillSourceName(batch.from,batch.id)} ×${batch.count}`;
 if(!job){updateLabPhase('done',`装罐完成 · ${name}`);return}
 const {left,duration}=job;
 const phase=left===duration?'heat':left>duration/2?'condense':'collect';
 const labels={heat:'加热原料',condense:'蒸气冷凝',collect:'装入精华罐'};
 updateLabPhase(phase,`${labels[phase]} · ${name}`);
 updateMeter('distill-time','distill-bar',`剩余 ${left} 秒`,(duration-left)/duration*100);
}
function updateInfusion(){
 const job=S.infusion;
 const ritual=job||U.infusionResult;
 if(!ritual){updateLabPhase('idle','祭坛待命');return}
 const recipe=RECIPES[ritual.id];
 if(!job){updateLabPhase('done',`注魔完成 · ${recipe.n}`);return}
 const duration=infusionDuration(recipe);
 const {left}=job;
 const phase=left===duration?'attune':left>2?'draw':'bind';
 const labels={attune:'启动符文矩阵',draw:'导入罐装精华',bind:'融合祭坛材料'};
 updateLabPhase(phase,`${labels[phase]} · ${recipe.n}`);
 updateMeter('infusion-time','infusion-bar',`剩余 ${left} 秒`,(duration-left)/duration*100);
}
function updateMainMeters(){
 updateSoapControls();
 if(U.tab==='world'){updateWashPanel();updateWarpPanel()}
 else if(U.tab==='cru')updateCrucible();
 else if(U.tab==='distill')updateDistillation();
 else if(U.tab==='inf')updateInfusion();
 else if(U.tab==='node'){
  if(S.node)updateMeter('net','neb',Math.floor(S.node.e),S.node.e/S.node.max*100);
  else if(S.search>0)updateMeter('nst','nsb',`搜寻中… ${S.search} 秒`,(1-S.search/Math.max(S.search,inv('resonance_compass')?3:8))*100);
  else updateMeter('nst','nsb','尚未搜寻',0);
 }
}
function tick(){
 S.tk++;
 let mainDirty=false,inventoryDirty=false,poolsDirty=false,wandDirty=false,visChanged=false;
 /* 光环与魔杖 */
 const auraGain=0.8*(1-S.flux/130);
 for(const p of P)S.aura[p]=Math.min(AMAX,S.aura[p]+auraGain);
 if(hasWand()&&S.flux<60){
  const max=wandMax(),rate=0.25*(1+eqVal('regen')),showCosts=visTabs.has(U.tab);
  for(const p of P){
   const before=S.vis[p];
   const gain=Math.min(rate,S.aura[p],max-before);
   if(gain<=0)continue;
   S.vis[p]+=gain;
   S.aura[p]-=gain;
   visChanged=true;
   if(showCosts&&Math.floor(before)!==Math.floor(S.vis[p]))mainDirty=true;
  }
 }
 /* 污染 */
 S.flux=Math.max(0,S.flux-0.1*(1+eqVal('flux'))+S.taint.length*0.03);
 if(S.flux>=45&&Math.random()<(S.flux>=70?0.3:0.12)&&S.taint.length<TILES.length-3){
  const f=TILES.map(t=>t.id).filter(x=>!S.taint.includes(x));if(f.length){const id=rnd(f);S.taint.push(id);msg(`${SITES[id].n}出现了魔力污染。`,'bad');if(U.tab==='world'||U.tab==='golem')mainDirty=true}
 }
 if(S.flux>=100){
  outburst();
  inventoryDirty=wandDirty=true;
  if(U.tab==='world')mainDirty=true;
 }
 /* 坩埚 */
 if(S.cru.heat>0){
  const wasFull=S.cru.heat>=240;
  S.cru.heat=Math.max(0,S.cru.heat-1);
  if(U.tab==='cru'&&(wasFull||S.cru.heat===0))mainDirty=true;
 }
 /* 蒸馏与注魔 */
 if(S.distill&&--S.distill.left===0){
  finishDistill();
  inventoryDirty=poolsDirty=true;
  if(U.tab==='distill')mainDirty=true;
 }
 if(U.distillResult&&S.tk>=U.distillResult.until){
  U.distillResult=null;
  if(U.tab==='distill')mainDirty=true;
 }
 if(S.infusion&&--S.infusion.left===0){
  const recipe=RECIPES[S.infusion.id];
  S.infusion=null;
  completeRecipe(recipe);
  U.infusionResult={id:recipe.id,until:S.tk+4};
  inventoryDirty=wandDirty=true;
  if(U.tab==='inf')mainDirty=true;
  save();
 }
 if(U.infusionResult&&S.tk>=U.infusionResult.until){
  U.infusionResult=null;
  if(U.tab==='inf')mainDirty=true;
 }
 /* 节点 */
 if(S.search>0&&--S.search===0){
  const pr=P.slice().sort(()=>Math.random()-.5).slice(0,2);
  S.node={n:`${A[pr[0]].f}${A[pr[1]].f}节点`,pr,e:150,max:150};
  msg(`你找到了一个节点：${S.node.n}。`,'gold');
  wandDirty=true;
  if(U.tab==='node')mainDirty=true;
 }
 if(S.node&&S.node.e<S.node.max)S.node.e=Math.min(S.node.max,S.node.e+0.4);
 /* 灵感 */
 if(S.tk%8===0){
  S.pool[rnd(P)]++;
  poolsDirty=true;
 }
 /* 魔像 */
 for(const g of S.golems){
  if(golemLock(g.t,g.task)||S.taint.includes(GTASK[g.task].site))continue;
  g.acc+=golemRate(g.t,g.task);
  if(g.acc<1)continue;
  const count=Math.floor(g.acc);
  g.acc-=count;
  give(g.task,count);
  inventoryDirty=true;
 }
 if(S.visExhaust>0&&--S.visExhaust===0&&visTabs.has(U.tab))mainDirty=true;
 if(S.scrub&&--S.scrub.left===0)finishScrub();
 if(S.tk%100===0&&!S.ward&&warpTotal()>0){
  checkWarp();
  poolsDirty=true;
  if(U.tab==='notes'||visTabs.has(U.tab))mainDirty=true;
 }
 if(S.ward>0)S.ward--;
 if(poolsDirty){
  renderPools();
  if(U.tab==='notes'&&(U.notesView==='aspects'||U.notesView==='research'&&S.rs))mainDirty=true;
 }
 if(inventoryDirty){
  renderInventory();
  if(inventoryTabs.has(U.tab))mainDirty=true;
 }
 if(wandDirty)renderWand();
 else if(visChanged)updateWand();
 if(mainDirty)renderMain();
 else updateMainMeters();
 renderHud();
 if(S.tk%10===0)save();
}

/* ---------- 启动 ---------- */
S=load();
if(!S.log.length)msg('欢迎，学徒。先去「世界」砍几棵树。','gold');
render();
setInterval(tick,1000);
window.addEventListener('pagehide',()=>save());
globalThis.__arc={get S(){return S},ACT,render,tick,R,RS,TILES,Q,A,IT,NB,GT,GTASK,RODS,canRecipe,canCombine,EQ,disc,has,isEq,equipItem,eqVal,ichorSet};
})();
</script>
