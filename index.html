<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:dark;background:#120e1a}body{margin:0;font-size:14px}</style></head><body>
<title>奥术学徒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;800&display=swap">
<style>
/* Layout: three-column workbench (tabs | active station | wand + pack), stacks to one column at phone width */
:root{
  --bg:#120e1a; --panel:#1a1427; --panel-hi:#241b36; --slot:#0f0b17;
  --line:#382c50; --line-hi:#5b4687;
  --fg:#ece6f8; --muted:#a698c4; --accent:#a97bff; --accent-ink:#17102a; --gold:#e9c46a;
  --ok:#6fd49a; --bad:#ff7a8a; --flux:#d062ea;
  --f-disp:'Noto Serif SC','Songti SC','STSong',serif;
  --f-latin:'Cinzel','Noto Serif SC',serif;
  --f-body:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:radial-gradient(900px 420px at 18% -8%,#2a1d46 0%,rgba(42,29,70,0) 70%),var(--bg);
  background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
small{color:var(--muted);font-weight:400}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:.08em;line-height:1.1}
.brand span{display:block;font-family:var(--f-latin);font-size:12px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-top:4px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:4px;font-size:13px}
.hchip b{font-variant-numeric:tabular-nums}
.hchip .bar{width:84px}

/* quest strip */
.quest{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:4px;padding:10px 14px;margin-bottom:14px}
.quest .qn{font-family:var(--f-latin);font-size:12px;letter-spacing:.2em;color:var(--gold)}
.quest .qt{flex:1 1 260px;min-width:0}
.quest.done{border-color:var(--gold)}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
@media(max-width:1020px){.grid{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}.nav .tab small{display:none}.nav .tab b{font-size:11px}.nav .tab{padding:2px}.grid .nav{grid-template-columns:repeat(6,minmax(0,1fr))}}

.nav{grid-column:1/-1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;max-width:880px}
.tab{aspect-ratio:1;width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px}
.tab b{display:block;font-family:var(--f-disp);font-size:13px;line-height:1.2}
.tab small{font-size:10px;line-height:1.3}
.tab:hover{border-color:var(--line-hi)}
.tab.on{background:var(--panel-hi);border-color:var(--gold)}
.tab.on b{color:var(--gold)}
.tab.lock{opacity:.55}

.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px}
.card+.card{margin-top:12px}
.card>h3,.sec>h3{font-size:16px;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.lead{color:var(--muted);margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:4px;padding:7px 14px;font-weight:500;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--accent);background:#2e2346}
.btn:focus-visible,.tab:focus-visible,.tile:focus-visible,.hex:focus-visible,.pal button:focus-visible,.slot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover:not(:disabled){background:#bb96ff}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* aspect + item icons */
.asp{--c:#fff;--t:#17102a;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 62%,color-mix(in srgb,var(--c) 70%,#000));
  color:var(--t);font-style:normal;font-weight:800;font-size:12px;font-family:var(--f-disp);flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.asp.lg{width:38px;height:38px;font-size:18px}
.asp.q{--c:#3a3052;--t:var(--muted)}
.ico{--c:#888;--t:#fff;display:inline-grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border-radius:3px;
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:var(--t);font-style:normal;font-weight:800;font-family:var(--f-disp);font-size:16px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 0 0 1px #000}
.ico.s{width:22px;height:22px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--slot);border:1px solid var(--line);border-radius:14px;padding:2px 9px 2px 3px;font-size:13px}
.chip b{font-variant-numeric:tabular-nums}
.chip.z{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:8px;background:var(--slot);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:1 1 auto;min-width:40px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));width:0}

/* world tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{--c:#777;position:relative;text-align:left;border:1px solid var(--line);border-radius:4px;padding:0;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.tile .pic{height:74px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:30px;color:rgba(255,255,255,.85);
  background:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25% 50%,rgba(255,255,255,.07) 50% 75%,transparent 75%) 0 0/10px 10px,linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 50%,#000))}
.tile .tx{padding:8px 10px 10px}
.tile b{display:block;font-family:var(--f-disp)}
.tile small{display:block;font-size:12px}
.tile:hover:not(.lockd){border-color:var(--gold);transform:translateY(-1px)}
.tile:active:not(.lockd){transform:translateY(1px)}
.tile.lockd{opacity:.5;cursor:not-allowed}
.tile.taint .pic{background:repeating-linear-gradient(135deg,#4a1a5a 0 8px,#2a0f36 8px 16px);color:#e8b2ff}
.tile.taint{border-color:var(--flux)}

/* backpack */
.bagwrap{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:720px){.bagwrap{grid-template-columns:minmax(0,1fr)}}
.bag9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.bag9 .slot{min-width:0;background:#0c0914;border-color:#000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.07),inset -1px -1px 0 rgba(255,255,255,.03)}
.bag9 .slot .ico{width:min(34px,78%);height:auto;aspect-ratio:1;font-size:clamp(11px,2.6vw,16px)}
.bag9 .slot.empty{opacity:.6}
.eqg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot.eqs{background:#0c0914;border-color:#000}
.slot.eqs .ico{width:min(34px,72%);height:auto;aspect-ratio:1;margin-bottom:8px}
.slot .lb{position:absolute;left:0;right:0;bottom:2px;font-size:10px;line-height:1;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.eqs:not(.on) .lb{position:static;font-size:11px}
.eff{margin-top:12px;display:grid;gap:6px;font-size:13px}
.eff small{display:block;font-size:12px}
/* element book drawer */
#drawer{position:fixed;top:0;bottom:0;right:0;z-index:40;width:min(340px,88vw);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--gold);transform:translateX(100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawer.open{transform:none;box-shadow:-8px 0 24px rgba(0,0,0,.45)}
#drawer:not(.open) .dhead,#drawer:not(.open) #dbody{visibility:hidden}
#dtab{position:absolute;left:-37px;top:38%;width:37px;padding:14px 0;writing-mode:vertical-rl;letter-spacing:.2em;background:var(--panel);color:var(--gold);border:1px solid var(--gold);border-right:0;border-radius:6px 0 0 6px;font-family:var(--f-disp);font-weight:700;font-size:14px}
#dtab:hover{background:var(--panel-hi)}
#dtab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:16px}
.dhead p{font-size:12px;color:var(--muted);margin-top:2px}
#dbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px;display:grid;gap:8px;align-content:start}
.dr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--slot);border:1px solid var(--line);border-radius:4px;padding:8px}
.dr.on{border-color:var(--gold)}
.dr.zero .dn small{opacity:.7}
.dpick{background:transparent;border:0;padding:0;display:grid;place-items:center}
.dl{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:var(--muted)}
.dl .asp{width:20px;height:20px;font-size:10px}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
/* pop text */
#pops{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:fixed;font-weight:700;color:var(--gold);transform:translate(-50%,-8px);animation:up .9s ease-out forwards;text-shadow:0 1px 0 #000;white-space:nowrap}
.pop.bad{color:var(--bad)}
@keyframes up{to{transform:translate(-50%,-48px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.tile:hover,.tile:active{transform:none!important}}

/* recipes */
.recs{display:grid;gap:8px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.rec.no{background:#171122}
.rec b.nm{font-family:var(--f-disp)}
.rec p{color:var(--muted);font-size:13px}
.need{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.nc{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--slot);border:1px solid var(--line);border-radius:3px;padding:2px 7px 2px 3px}
.nc b{font-weight:500}
.nc em{font-style:normal;font-variant-numeric:tabular-nums}
.nc.ok em{color:var(--ok)}
.nc.lack{border-color:#6a3040}
.nc.lack em{color:var(--bad)}
.why{color:var(--bad);font-size:12px;margin-top:4px}
@media(max-width:520px){.rec{grid-template-columns:auto minmax(0,1fr)}.rec .btn{grid-column:1/-1}}

/* notes / research */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 12px}
.cat.on{border-color:var(--gold);color:var(--gold)}
.rs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px}
.rs.done{border-color:#2f6b50}
.rs.done b.nm::after{content:" 已完成";color:var(--ok);font-size:12px;font-family:var(--f-body);font-weight:500}
.rs b.nm{font-family:var(--f-disp)}
.rs p{color:var(--muted);font-size:13px;grid-column:1/-1}
.rs .st{font-size:12px;color:var(--muted)}
.table{background:linear-gradient(180deg,#201733,#171022);border:1px solid var(--gold);border-radius:4px;padding:16px}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0;padding:26px 0 36px;max-width:100%}
.hex{--off:0px;position:relative;width:62px;height:56px;flex:0 0 auto;transform:translateY(var(--off));background:transparent;border:0;padding:0;
  clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);}
.hex .hx{position:absolute;inset:0;background:var(--line-hi);clip-path:inherit;display:grid;place-items:center}
.hex .hi{position:absolute;inset:3px;background:var(--slot);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);display:grid;place-items:center;color:var(--muted);font-size:20px}
.hex.fixed .hx{background:var(--gold)}
.hex.fixed{cursor:default}
.hex.empty:hover .hx{background:var(--accent)}
.lk{width:10px;height:3px;background:var(--line);flex:0 0 auto}
.lk.ok{background:var(--ok)}.lk.bad{background:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pal .pi{display:flex;align-items:center;gap:2px;background:var(--slot);border:1px solid var(--line);border-radius:18px;padding:2px 4px 2px 2px}
.pal .pi.on{border-color:var(--gold);background:#2a2036}
.pal .pi.z{opacity:.5}
.pal button.sel{background:transparent;border:0;display:flex;align-items:center;gap:5px;padding:0 6px 0 0}
.pal .mk{background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:10px;font-size:11px;padding:0 7px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.bk{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.bk b{font-family:var(--f-disp)}
.bk small{display:block;font-size:12px}
.bk .eq{display:flex;align-items:center;gap:4px;margin-top:3px}
.bk.lockd{opacity:.5}

/* crucible, node */
.vessel{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.meter{display:grid;gap:4px}
.meter .bar{height:12px}
.dis{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.dis:first-child{border-top:0}
.node{display:grid;gap:10px}

/* side */
.side>.card{margin-bottom:12px}
.side .card+.card{margin-top:0}
.side h3{font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.vrow{display:grid;grid-template-columns:auto 1fr 62px;gap:8px;align-items:center;margin-bottom:5px}
.vrow span{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.slot{position:relative;aspect-ratio:1;background:var(--slot);border:1px solid var(--line);border-radius:3px;padding:0;display:grid;place-items:center}
.slot .ico{width:34px;height:34px}
.slot em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:11px;font-weight:700;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.slot.on{border-color:var(--gold)}
.slot.scanned::after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.log{max-height:170px;overflow:auto;font-size:13px;display:grid;gap:3px}
.log p.bad{color:var(--bad)}.log p.good{color:var(--ok)}.log p.gold{color:var(--gold)}
.foot{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:13px}
.save-status{flex-basis:100%}
.save-status:empty{position:absolute}
.save-status.good{color:var(--ok)}
.save-status.bad{color:var(--bad)}
.win{border-color:var(--gold);background:linear-gradient(180deg,#2c2140,#1a1427)}
.win h2{color:var(--gold);font-size:22px;margin-bottom:6px}
.golem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.golem .tasks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.golem .tasks .btn.on{border-color:var(--gold);color:var(--gold)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>奥术学徒</h1><span>Arcane Apprentice</span></div>
    <div class="hud" id="hud"></div>
  </header>
  <div class="quest" id="quest"></div>
  <div class="grid">
    <nav class="nav" id="nav" aria-label="工作站"></nav>
    <main id="main"></main>
    <aside class="side" id="side">
      <section class="card" id="wandp"></section>
      <section class="card" id="pools"></section>
      <section class="card" id="invp"></section>
      <section class="card" id="info"></section>
      <section class="card" id="logp"></section>
    </aside>
  </div>
  <footer class="foot" id="foot">
    <div class="row" id="save-actions"></div>
    <input type="file" id="save-file" accept=".json,application/json" hidden>
    <p class="save-status" id="save-status" role="status"></p>
    <span>进度每 10 秒自动保存在本机浏览器。这是一个向《神秘时代 4》致意的同人小游戏，全程只需鼠标。</span>
  </footer>
</div>
<div id="pops"></div>
<aside id="drawer" aria-label="元素册">
  <button id="dtab" data-act="drawer" aria-expanded="false" aria-controls="dbody">元素册</button>
  <div class="dhead"><div><h3>元素册</h3><p>点左侧圆标选中元素，再去研究格子里放置。「相邻」是能与它直接相连的已知元素。</p></div><button class="btn sm" data-act="drawer">收起</button></div>
  <div id="dbody"></div>
</aside>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const KEY='arcane-apprentice-v1';

/* ---------- 元素 ---------- */
const P=['aer','terra','ignis','aqua','ordo','perditio'];
const A={
 aer:{n:'风',f:'风',l:'Aer',c:'#f5e66b'},
 terra:{n:'地',f:'地',l:'Terra',c:'#4fbf4f'},
 ignis:{n:'火',f:'火',l:'Ignis',c:'#ff6a35'},
 aqua:{n:'水',f:'水',l:'Aqua',c:'#3fc4f2'},
 ordo:{n:'序',f:'秩序',l:'Ordo',c:'#d9d8f0'},
 perditio:{n:'乱',f:'混沌',l:'Perditio',c:'#6a6682'},
 vacuos:{n:'空',f:'虚空',l:'Vacuos',c:'#8f8fb0',p:['aer','perditio']},
 lux:{n:'光',f:'光明',l:'Lux',c:'#fff3a3',p:['aer','ignis']},
 motus:{n:'动',f:'运动',l:'Motus',c:'#b9b6ee',p:['aer','ordo']},
 gelum:{n:'冰',f:'寒冰',l:'Gelum',c:'#d4fbff',p:['ignis','perditio']},
 vitreus:{n:'晶',f:'水晶',l:'Vitreus',c:'#7ff0f0',p:['terra','ordo']},
 metallum:{n:'金',f:'金属',l:'Metallum',c:'#aeb3cf',p:['terra','vitreus']},
 victus:{n:'命',f:'生命',l:'Victus',c:'#e0323a',p:['aqua','terra']},
 mortuus:{n:'死',f:'死亡',l:'Mortuus',c:'#8d7a8f',p:['victus','perditio']},
 potentia:{n:'能',f:'能量',l:'Potentia',c:'#9ff2ff',p:['ordo','ignis']},
 permutatio:{n:'变',f:'变换',l:'Permutatio',c:'#5f9a5f',p:['perditio','ordo']},
 praecantatio:{n:'魔',f:'魔力',l:'Praecantatio',c:'#d23cff',p:['vacuos','potentia']},

const isRecord=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const isAmount=v=>Number.isFinite(v)&&v>=0;
const isCount=v=>Number.isSafeInteger(v)&&v>=0;
const isFlag=v=>v===0||v===1||typeof v==='boolean';
const hasId=(table,id)=>typeof id==='string'&&Object.hasOwn(table,id);
const validMap=(map,test,ids)=>isRecord(map)&&Object.entries(map).every(([id,v])=>(!ids||Object.hasOwn(ids,id))&&test(v));

function decodeSave(text){
 let data=JSON.parse(text);
 if(isRecord(data)&&Object.hasOwn(data,'format')){
  if(data.format!==KEY)return null;
  data=data.state;
 }
 if(!isRecord(data)||!Object.hasOwn(data,'inv')||!Object.hasOwn(data,'ever'))return null;

 const state=fresh();
 const legacyEquipment=data.equip==null;
 for(const key of Object.keys(state)){
  if(Object.hasOwn(data,key)&&!(key==='equip'&&legacyEquipment))state[key]=data[key];
 }
 const {inv,ever,pool,ess,known,scanned,res,has,built,vis,aura,tools,wand,cru,equip,outer,node,rs,golems,taint,log}=state;
 if(!isRecord(outer)||!isFlag(outer.on)||![outer.depth,outer.best].every(isCount)||!isAmount(outer.st))return null;
 if(![inv,ever,outer.loot].every(map=>validMap(map,isCount,IT)))return null;
 if(![pool,ess].every(map=>validMap(map,isCount,A))||!P.every(p=>Object.hasOwn(pool,p)))return null;
 if(![[known,A],[scanned,IT],[res,RSD],[has],[built]].every(([map,ids])=>validMap(map,isFlag,ids)))return null;
 if(![vis,aura].every(map=>validMap(map,isAmount,A)&&P.every(p=>Object.hasOwn(map,p))))return null;
 if(!isAmount(state.flux)||![state.warp,state.search,state.stab,state.tk].every(isCount)||!isFlag(state.won))return null;
 if(!isRecord(tools)||![tools.pick,tools.axe].every(isCount))return null;
 if(!isRecord(cru)||![cru.water,cru.heat].every(isAmount))return null;
 if(!isRecord(wand)||!(wand.rod===null||hasId(RODS,wand.rod))||!(wand.cap===null||hasId(CAPS,wand.cap)))return null;
 if(![null,'focus_dig','focus_fuse'].includes(state.focus))return null;
 if(!isRecord(equip)||Object.keys(equip).length!==SLOTS.length||!SLOTS.every(([slot])=>{
  const id=equip[slot];
  return id===null||(hasId(EQ,id)&&EQ[id].slot===(slot.startsWith('ring')?'ring':slot));
 }))return null;
 if(node!==null&&(!isRecord(node)||typeof node.n!=='string'||!isAmount(node.e)||!isAmount(node.max)||node.max===0
  ||!Array.isArray(node.pr)||!node.pr.every(p=>P.includes(p))))return null;
 if(rs!==null&&(!isRecord(rs)||!hasId(RSD,rs.id)||!Array.isArray(rs.cells)
  ||rs.cells.length!==RSD[rs.id].len||!rs.cells.every(id=>id===null||hasId(A,id))))return null;
 if(!Array.isArray(golems)||!golems.every(g=>isRecord(g)&&hasId(GT,g.t)&&hasId(GTASK,g.task)&&isAmount(g.acc)))return null;
 if(!Array.isArray(taint)||!taint.every(id=>TILES.some(t=>t.id===id)))return null;
 if(!Array.isArray(log)||!log.every(l=>isRecord(l)&&typeof l.t==='string'&&['','good','bad','gold'].includes(l.k)))return null;

 if(legacyEquipment&&inv.amulet>0){
  equip.charm='amulet';
  if(--inv.amulet===0)delete inv.amulet;
 }
 return state;
}

function canCombine(kind,id){
 const a=A[id]; if(!a.p) return false;
 const pool=kind==='ess'?S.ess:S.pool;
 return !!(S.known[a.p[0]]&&S.known[a.p[1]]&&(pool[a.p[0]]||0)>=1&&(pool[a.p[1]]||0)>=1);
}
function combine(kind,id,e){
 const a=A[id]; if(!a.p) return;
 if(!S.known[a.p[0]]||!S.known[a.p[1]]){msg('还不了解它的成分。','bad');return}
 const pool=kind==='ess'?S.ess:S.pool;
 if((pool[a.p[0]]||0)<1||(pool[a.p[1]]||0)<1){msg(`需要 ${A[a.p[0]].f} 与 ${A[a.p[1]].f} 各一份。`,'bad');return}
 pool[a.p[0]]--;pool[a.p[1]]--;
 if(kind==='ess'){
  [a.p[0],a.p[1]].forEach(x=>{if(pool[x]<=0)delete pool[x]});
  if((pool[id]||0)<64)pool[id]=(pool[id]||0)+1;
 } else pool[id]=(pool[id]||0)+1;
 if(!S.known[id]){S.known[id]=1;msg(`你发现了元素：${A[id].f}（${A[id].l}）。`,'gold')}
 if(e)pop(e,'+1 '+A[id].f);
}

const rvis=r=>!r.req||S.res[r.req];
function canRecipe(r){
 let ok=true;const why=[];
 for(const k in (r.inp||{})) if(inv(k)<r.inp[k]) ok=false;
 if(r.vis){ if(!hasWand()){ok=false;why.push('需要魔杖')} else for(const p in r.vis) if(S.vis[p]<vcost(r.vis[p])) ok=false; }
 if(r.ess) for(const a in r.ess) if((S.ess[a]||0)<r.ess[a]) ok=false;
 if(r.need&&!r.need()){ok=false;why.push(r.needTxt)}
 if(r.once&&S.built[r.id]){ok=false;why.push('已完成')}
 if(r.tool){const [k,v]=r.tool; if(S.tools[k]>=v){ok=false;why.push('已拥有')} else if(S.tools[k]<v-1){ok=false;why.push('需要先做低一级的工具')}}
 if(r.eq){const [slot,id]=r.eq;const tbl=slot==='rod'?RODS:CAPS;const cur=S.wand[slot]; if(cur&&tbl[cur].rank>=tbl[id].rank){ok=false;why.push('已装备同级或更好的')}}
 if(r.st==='cru'){ if(S.cru.heat<=0){ok=false;why.push('坩埚需要加热')} if(S.cru.water<=0){ok=false;why.push('坩埚需要加水')} }
 return {ok,why};
}
function doRecipe(id,e){
 const r=R.find(x=>x.id===id); if(!r) return;
 const c=canRecipe(r); if(!c.ok){msg('条件不足。','bad');return}
 for(const k in (r.inp||{})) take(k,r.inp[k]);
 if(r.vis) for(const p in r.vis) S.vis[p]-=vcost(r.vis[p]);
 if(r.ess) for(const a in r.ess){S.ess[a]-=r.ess[a];if(S.ess[a]<=0)delete S.ess[a]}
 if(r.st==='cru') S.cru.water--;
 if(r.out) for(const k in r.out) give(k,r.out[k]);
 if(r.out) for(const k in r.out) if(EQ[k]&&!S.equip[slotFor(k)]&&!(EQ[k].slot==='ring'&&isEq(k))) equipItem(k);
 if(r.tool) S.tools[r.tool[0]]=r.tool[1];
 if(r.eq){S.wand[r.eq[0]]=r.eq[1];}
 if(r.once) S.built[r.id]=1;
 if(r.fx) r.fx();
 if(r.inst&&r.inst>S.stab){const f=(r.inst-S.stab)*4;addFlux(f);msg(`注魔不稳定，释放了 ${f} 点污染。多做些稳定符文。`,'bad')}
 msg(`完成：${r.n}。`,'good');
 if(e)pop(e,'完成 '+r.n);
 checkWin();
}

function harvest(id,e){
 const t=TILES.find(x=>x.id===id);
 if(t.res&&!S.res[t.res]){msg('你还不知道这个地方。','bad');return}
 if(S.taint.includes(id)){msg('这里被魔力污染了，先净化。','bad');return}
 if(t.pick&&S.tools.pick<t.pick){msg(`需要${t.pick===1?'石镐':'铁镐'}才能采集${IT[t.item].n}。`,'bad');pop(e,'工具不足','bad');return}
 if(Math.random()>t.ch){pop(e,'扑空','bad');return}
 let item=t.item,qty=1;
 if(t.drops){let w=t.drops.reduce((x,d)=>x+d[1],0)*Math.random();for(const d of t.drops){w-=d[1];if(w<=0){item=d[0];break}}}
 if((t.id==='tree'||t.id==='greenwood')&&S.tools.axe>=1)qty=S.tools.axe>=2?3:2;
 if(['cobble','coal','ironore','goldore','redstone'].includes(item)&&S.tools.pick>=2)qty=S.tools.pick>=3?3:2;
 if(inv('attractor')>0&&Math.random()<.25)qty+=1;
 if(Math.random()<eqVal('luck'))qty+=1;
 if(S.focus==='focus_dig'&&inv('focus_dig')&&hasWand()&&S.vis.terra>=2){S.vis.terra-=2;qty*=2}
 if(S.focus==='focus_fuse'&&inv('focus_fuse')&&hasWand()&&S.vis.ignis>=2&&['ironore','goldore','sand'].includes(item)){S.vis.ignis-=2;item={ironore:'iron',goldore:'gold',sand:'glass'}[item]}
 give(item,qty);
 if(t.warp){S.warp+=t.warp}
 pop(e,`+${qty} ${IT[item].n}`);
 if(t.id==='tree'&&Math.random()<.25){give('sapling',1);pop(e,'+1 树苗')}
 light();
}

function charge(src,e){
 if(!hasWand()){msg('你还没有魔杖。','bad');return}
 const max=wandMax();let add=0;
 if(src==='aura'){
  P.forEach(p=>{const t=Math.min(5,S.aura[p],max-S.vis[p]);if(t>0){S.vis[p]+=t;S.aura[p]-=t;add+=t}});
 } else {
  if(!S.node){return}
  if(S.node.e<6){msg('节点能量耗尽，等它恢复。','bad');return}
  P.forEach(p=>{const t=Math.min(S.node.pr.includes(p)?10:4,max-S.vis[p]);if(t>0){S.vis[p]+=t;add+=t}});
  if(add>0){S.node.e-=6;if(S.node.e<30){addFlux(2);msg('节点被过度汲取，魔力污染上升。','bad')}}
 }
 if(add<=0){msg('魔杖已满，或这里没有可用的魔力。','bad');return}
 pop(e,'+'+Math.round(add)+' 魔力');light();
}

function rsState(d){

}

function rsOk(){

function dissolve(id,all,e){
 if(S.cru.heat<=0||S.cru.water<=0){msg('坩埚需要先加热并加水。','bad');return}
 const n=all?inv(id):Math.min(1,inv(id)); if(n<=0)return;
 take(id,n);S.cru.water--;let over=0;
 for(const a in IT[id].a){
  const add=IT[id].a[a]*n;const cur=S.ess[a]||0;const room=Math.max(0,64-cur);
  S.ess[a]=cur+Math.min(add,room);over+=Math.max(0,add-room);S.known[a]=1;
 }
 if(over>0){msg(`精华溢出，散失了 ${over} 份。用不上的精华可以誊写为灵感。`,'bad')}
 msg(`溶解 ${IT[id].n}×${n}。`);if(e)pop(e,'溶解');render();
}

/* ---------- 胜利 ---------- */
function isEq(id){return Object.keys(S.equip).some(s=>S.equip[s]===id)}
function has(id){return inv(id)>0||isEq(id)}
function eqVal(p){let v=0;for(const s in S.equip){const id=S.equip[s];if(id&&EQ[id]&&EQ[id][p])v+=EQ[id][p]}return v}
function setBonus(){return S.equip.body==='robe_chest'&&S.equip.legs==='robe_legs'&&S.equip.feet==='robe_boots'}
function ichorSet(){return S.equip.head==='ichor_cowl'&&S.equip.body==='ichor_robe'&&S.equip.legs==='ichor_legs'&&S.equip.feet==='ichor_boots'}
function slotFor(id){const sl=EQ[id].slot;if(sl!=='ring')return sl;if(!S.equip.ring1)return 'ring1';if(!S.equip.ring2)return 'ring2';return 'ring1'}
function equipItem(id){
 if(!EQ[id]||inv(id)<1)return;
 if(EQ[id].slot==='ring'&&isEq(id)){msg('已经戴着一枚同样的戒指了。','bad');return}
 const sl=slotFor(id),old=S.equip[sl];
 take(id,1);if(old)S.inv[old]=inv(old)+1;
 S.equip[sl]=id;msg(`装备了${IT[id].n}。`,'good');render();
}
function unequip(sl){
 const id=S.equip[sl];if(!id)return;
 S.equip[sl]=null;S.inv[id]=inv(id)+1;msg(`卸下了${IT[id].n}。`);render();
}
function useItem(id){
 if(inv(id)<1)return;
 if(id.startsWith('shard_')){
  if(!hasWand()){msg('需要先有一根魔杖。','bad');return}
  const p=id.slice(6);S.vis[p]=Math.min(wandMax(),S.vis[p]+12);take(id,1);msg(`向魔杖充入了 12 点${A[p].f}魔力。`,'good');render();
 }
}
const HZ=['暗影从裂缝里伸出手。','脚下的地面忽然变成了水。','一阵低语让你耳鸣。','有东西在看着你，你确定。','空气里的魔力凝成了刀刃。'];
function outerBank(){const o=S.outer;for(const k in o.loot)give(k,o.loot[k])}
function outerReset(){S.outer={on:0,depth:0,st:100,loot:{},best:S.outer.best||0}}
function outerEnd(){
 if(inv('escape')>0){take('escape',1);outerBank();S.warp+=1;msg('逃脱符印发出微光，你带着战利品回到了现实。','gold')}
 else{S.warp+=3;addFlux(12);msg('稳定度归零，你被异域吞没，战利品全部丢失。扭曲 +3。','bad')}
 outerReset();
}
function outerDeeper(e){
 const o=S.outer;if(!o.on)return;
 o.depth++;o.best=Math.max(o.best||0,o.depth);
 if(ichorSet())o.st=Math.min(100,o.st+3);
 if(o.depth>=3&&Math.random()<.2)S.warp+=1;
 if(Math.random()<Math.max(.05,Math.min(.75,.22+o.depth*.06)-eqVal('hazard'))){
  const dmg=Math.round((8+o.depth*3+Math.floor(Math.random()*8))*(1-Math.min(.7,eqVal('dmg'))));
  o.st-=dmg;addFlux(1);msg(`${rnd(HZ)}稳定度 −${dmg}。`,'bad');pop(e,'−'+dmg,'bad');
  if(o.st<=0)outerEnd();
 }else{
  const tbl=[['voidshard',4],['shard',3],['flesh',2]];
  if(o.depth>=2)tbl.push(['quartz',2]);
  if(o.depth>=3)tbl.push(['ichor',1+Math.floor(o.depth/3)]);
  let w=tbl.reduce((x,d)=>x+d[1],0)*Math.random(),item=tbl[0][0];
  for(const d of tbl){w-=d[1];if(w<=0){item=d[0];break}}
  if(item==='shard')item='shard_'+rnd(P);
  const q=1+(Math.random()<.4?1:0)+Math.floor(o.depth/4)+(Math.random()<eqVal('loot')?1:0);
  o.loot[item]=(o.loot[item]||0)+q;
  msg(`你在第 ${o.depth} 层找到了 ${IT[item].n} ×${q}。`,'good');pop(e,'+'+q+' '+IT[item].n);
 }
 render();
}
function outerRetreat(){
 const o=S.outer;if(!o.on)return;
 const n=Object.keys(o.loot).reduce((x,k)=>x+o.loot[k],0);
 outerBank();msg(`你撤离了异域，带回 ${n} 件战利品。`,'good');outerReset();render();
}
function checkWin(){
 if(!S.won&&S.wand.cap==='void'&&has('amulet')&&S.golems.length>=3){S.won=1;msg('你通过了毕业试炼。','gold')}
}

/* ---------- 存档文件 ---------- */
const saveFile=$('#save-file');
function saveStatus(text,kind=''){
 const status=$('#save-status');
 status.textContent=text;
 status.className='save-status'+(kind?' '+kind:'');
}
function exportSave(){
 const json=JSON.stringify({format:KEY,state:S},null,2);
 const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
 const link=document.createElement('a');
 link.href=url;
 link.download='arcane-apprentice-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 saveStatus('已开始下载 JSON 存档。','good');
}
saveFile.addEventListener('change',async ()=>{
 const file=saveFile.files[0];
 saveFile.value='';
 if(!file||readingImport||pendingImport)return;
 readingImport=true;
 U.resetArm=false;
 renderFoot();
 saveStatus('正在读取存档…');
 try{
  pendingImport=decodeSave(await file.text());
  if(pendingImport)saveStatus('');
  else saveStatus('无法识别此存档。请选择《奥术学徒》的 JSON 存档。','bad');
 }catch{
  saveStatus('无法读取有效的 JSON 存档。','bad');
 }finally{
  readingImport=false;
  renderFoot();
  $(pendingImport?'[data-act="confirmImport"]':'[data-act="importSave"]').focus();
 }
});
function confirmImport(){
 if(!pendingImport)return;
 if(!save(pendingImport)){
  saveStatus('无法写入浏览器存档，当前进度已保留。','bad');
  return;
 }
 S=pendingImport;
 pendingImport=null;
 U.tab='world';U.sel=null;U.insp=null;U.pCool=0;
 render();
 saveStatus('存档已导入并保存。','good');
 $('#save-actions [data-act="importSave"]').focus();
}

const needV=(p,n)=>{const c=vcost(n),h=Math.floor(S.vis[p]||0);return `<span class="nc ${h>=c?'ok':'lack'}">${aspIcon(p)}<b>魔力</b><em>${h}/${c}</em></span>`};
const needE=(a,n)=>`<span class="nc ${(S.ess[a]||0)>=n?'ok':'lack'}">${aspIcon(a)}<b>${A[a].f}</b><em>${S.ess[a]||0}/${n}</em></span>`;
function recRow(r){
 const c=canRecipe(r);
 const ic=r.out?itemIcon(Object.keys(r.out)[0]):`<i class="ico" style="--c:${r.c||'#7a5cd6'};--t:#fff">${r.gl||'魔'}</i>`;

  +Object.keys(r.vis||{}).map(p=>needV(p,r.vis[p])).join('')

 return `<div class="rec ${c.ok?'':'no'}">${ic}<div><b class="nm">${r.n}${outTxt?` <small>→ ${outTxt}</small>`:''}</b><p>${r.d||''}</p><div class="need">${needs}</div>${c.why.length?`<div class="why">${c.why.join('；')}</div>`:''}</div><button class="btn ${c.ok?'primary':''}" data-act="craft" data-id="${r.id}" ${c.ok?'':'disabled'}>${r.verb||'合成'}</button></div>`;

  confirmation=`<button class="btn sm" data-act="reset" ${readingImport?'disabled':''}>重置存档</button>`;
 }
 setHtml($('#save-actions'),`<button class="btn sm" data-act="save">保存</button>
 <button class="btn sm" data-act="exportSave">导出 JSON</button>
 <button class="btn sm" data-act="importSave" ${readingImport||pendingImport?'disabled':''}>导入 JSON</button>
 ${confirmation}`);
}
function light(){renderHud();renderInv();renderQuest();updateWand();renderInfo();}
function render(){$('#invp').hidden=$('#info').hidden=(U.tab==='bag');renderDrawer();renderHud();renderQuest();renderNav();renderMain();renderWand();renderPools();renderInv();renderInfo();renderLog();renderFoot();}

/* ---------- 实时更新 ---------- */
function updateLive(){
 renderHud();updateWand();
 if(U.tab==='cru'){
  const a=$('#cwt'),b=$('#cwb'),c=$('#cht'),d=$('#chb');
  if(a){a.textContent=S.cru.water;b.style.width=(S.cru.water/16*100)+'%';c.textContent=Math.ceil(S.cru.heat);d.style.width=(S.cru.heat/240*100)+'%'}
 }
 if(U.tab==='node'&&S.node){const t=$('#net'),b=$('#neb');if(t){t.textContent=Math.floor(S.node.e);b.style.width=(S.node.e/S.node.max*100)+'%'}}
 if(U.tab==='node'&&!S.node&&S.search>0){const t=$('#nst'),b=$('#nsb');if(t){t.textContent='搜寻中… '+S.search+' 秒';b.style.width=((8-S.search)/8*100)+'%'}}
}
function tick(){
 S.tk++;
 let sideDirty=false,mainDirty=false;
 /* 光环与魔杖 */
 P.forEach(p=>{S.aura[p]=Math.min(AMAX,S.aura[p]+0.8*(1-S.flux/130))});
 if(hasWand()){const m=wandMax();P.forEach(p=>{const t=Math.min(0.25*(1+eqVal('regen')),S.aura[p],m-S.vis[p]);if(t>0&&S.flux<60){S.vis[p]+=t;S.aura[p]-=t}})}
 /* 污染 */
 S.flux=Math.max(0,S.flux-0.1*(1+eqVal('flux'))+S.taint.length*0.03);
 if(S.flux>=45&&Math.random()<(S.flux>=70?0.3:0.12)&&S.taint.length<TILES.length-3){
  const f=TILES.map(t=>t.id).filter(x=>!S.taint.includes(x));if(f.length){const id=rnd(f);S.taint.push(id);msg(`${TILES.find(t=>t.id===id).n}出现了魔力污染。`,'bad');if(U.tab==='world')mainDirty=true}
 }
 if(S.flux>=100){outburst();sideDirty=true;mainDirty=true}
 /* 坩埚 */
 if(S.cru.heat>0)S.cru.heat=Math.max(0,S.cru.heat-1);
 /* 节点 */
 if(S.search>0){S.search--;if(S.search===0){const pr=P.slice().sort(()=>Math.random()-.5).slice(0,2);S.node={n:`${A[pr[0]].f}${A[pr[1]].f}节点`,pr,e:150,max:150};msg(`你找到了一个节点：${S.node.n}。`,'gold');mainDirty=true;sideDirty=true}}
 if(S.node&&S.node.e<S.node.max)S.node.e=Math.min(S.node.max,S.node.e+0.4);
 /* 灵感 */
 if(S.tk%8===0){const a=rnd(P);S.pool[a]++;sideDirty=true;if(U.tab==='notes'&&S.rs)mainDirty=true}
 /* 魔像 */
 let got=false;
 S.golems.forEach(g=>{const r=GTASK[g.task][1]*GT[g.t].m*(inv('transvector')>0?1.5:1);g.acc+=r;if(g.acc>=1){const n=Math.floor(g.acc);g.acc-=n;give(g.task,n);got=true}});
 if(got){renderInv();renderQuest();if(U.tab==='bag')renderMain()}
 /* 扭曲低语 */
 if(S.warp>0&&S.tk%30===0){
  const p=Math.min(.7,S.warp/25)*(1-Math.min(.9,eqVal('warp')));
  if(Math.random()<p){const w=rnd(WARPFX);msg(w[0],'bad');w[1]();sideDirty=true;mainDirty=true}
 }
 if(sideDirty){renderPools();renderInv();renderLog()}
 if(mainDirty)renderMain();
 updateLive();
 if(S.tk%10===0)save();
}

/* ---------- 启动 ---------- */
S=load();
if(!S.log.length)msg('欢迎，学徒。先去「世界」砍几棵树。','gold');
render();
setInterval(tick,1000);
window.addEventListener('pagehide',()=>save());
globalThis.__arc={get S(){return S},ACT,render,tick,R,RS,TILES,Q,A,IT,NB,GT,GTASK,RODS,canRecipe,canCombine,EQ,disc,has,isEq,equipItem,eqVal,ichorSet};
})();
</script>
